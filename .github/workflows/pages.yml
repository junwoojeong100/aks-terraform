name: Build and deploy guides to GitHub Pages

# Every push to main rebuilds the guides from the sources on a clean checkout and publishes them:
#   cd tools && npm run build   (sync code + check docs + regenerate diagrams + build both HTML guides)
# Only the two single-file HTML guides (English and Korean) plus a small landing page are published.
# The site is always built from the pushed sources, so uncommitted local changes never reach it.
# To redeploy without a new commit, run this workflow manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check that the bootstrap stack ships with local state
        run: |
          if grep -Eq '^[[:space:]]*backend "azurerm"' terraform/02-bootstrap/versions.tf; then
            echo "::error file=terraform/02-bootstrap/versions.tf::Keep the backend block commented out in the repository. Uncommenting it is a local, per-environment step (Lab 02, step 4). Committing it breaks Lab 02 for new clones and puts the wrong code into the guide."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the guides
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage site
        run: |
          mkdir _site
          cp aks-terraform-guide.html aks-terraform-guide.ko.html _site/
          cp .github/pages/index.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
