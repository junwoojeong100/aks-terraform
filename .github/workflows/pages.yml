name: Deploy guides to GitHub Pages

# Every push to main publishes the two single-file HTML guides (English and Korean) plus a small landing page.
# The HTML files are generated by `cd tools && npm run build`; commit the regenerated files together with your changes.
# To redeploy without a new commit, run this workflow manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage site
        run: |
          mkdir _site
          cp aks-terraform-guide.html aks-terraform-guide.ko.html _site/
          cp .github/pages/index.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
