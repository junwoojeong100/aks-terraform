<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="account-hierarchy-t account-hierarchy-d"><title id="account-hierarchy-t">계정 · 리전 · 가용 영역 구조 비교</title><desc id="account-hierarchy-d">AWS 의 Organizations, OU, 계정, VPC, 서브넷과 Azure 의 테넌트, 관리 그룹, 구독, 리소스 그룹, VNet, 서브넷을 층별로 비교. Azure 에는 리소스 그룹이라는 계층이 더 있고 서브넷은 가용 영역에 묶이지 않는다.</desc><style>svg.dg{--dg-bg:#ffffff;--dg-fg:#1f2328;--dg-muted:#59636e;--dg-line:#6e7781;--dg-card:#f6f8fa;--dg-border:#d1d9e0;--dg-aws:#c2590a;--dg-aws-soft:#fff1e5;--dg-azure:#0b6ed0;--dg-azure-soft:#e5f1ff;--dg-ok:#1a7f37;--dg-ok-soft:#e6f6ea;--dg-id:#8250df;--dg-id-soft:#f3ecff;--dg-net:#0e7490;--dg-net-soft:#e0f4f8;--dg-warn:#9a6700;--dg-warn-soft:#fff6d6;--dg-danger:#cf222e;--dg-danger-soft:#ffebe9;font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif}
@media (prefers-color-scheme:dark){svg.dg{--dg-bg:#0d1117;--dg-fg:#e6edf3;--dg-muted:#9198a1;--dg-line:#8b949e;--dg-card:#151b23;--dg-border:#30363d;--dg-aws:#f0883e;--dg-aws-soft:#2b1c10;--dg-azure:#58a6ff;--dg-azure-soft:#0f2238;--dg-ok:#3fb950;--dg-ok-soft:#0f2417;--dg-id:#b392f0;--dg-id-soft:#221a36;--dg-net:#39c5cf;--dg-net-soft:#0d2a2f;--dg-warn:#d29922;--dg-warn-soft:#2d2208;--dg-danger:#ff7b72;--dg-danger-soft:#3a1517}}
.dg-bg{fill:var(--dg-bg)}
.dg-t{fill:var(--dg-fg)}
.dg-m{fill:var(--dg-muted)}
.dg-b{font-weight:650}
.dg-box,.dg-grp,.dg-chip{stroke-width:1.4}
.dg-box{fill:var(--dg-card);stroke:var(--dg-border)}
.dg-grp{fill:none;stroke:var(--dg-border)}
.dg-dash{stroke-dasharray:6 4}
.dg-chip{fill:var(--dg-bg);stroke:none}
.dg-line{fill:none;stroke:var(--dg-line);stroke-width:1.8}
.dg-ah{fill:var(--dg-line)}
.dg-box.dg-aws{fill:var(--dg-aws-soft);stroke:var(--dg-aws)}
.dg-grp.dg-aws{stroke:var(--dg-aws)}
.dg-fill-aws{fill:var(--dg-aws)}
.dg-tx-aws{fill:var(--dg-aws)}
.dg-line.dg-aws{stroke:var(--dg-aws)}
.dg-ah.dg-aws{fill:var(--dg-aws)}
.dg-box.dg-azure{fill:var(--dg-azure-soft);stroke:var(--dg-azure)}
.dg-grp.dg-azure{stroke:var(--dg-azure)}
.dg-fill-azure{fill:var(--dg-azure)}
.dg-tx-azure{fill:var(--dg-azure)}
.dg-line.dg-azure{stroke:var(--dg-azure)}
.dg-ah.dg-azure{fill:var(--dg-azure)}
.dg-box.dg-ok{fill:var(--dg-ok-soft);stroke:var(--dg-ok)}
.dg-grp.dg-ok{stroke:var(--dg-ok)}
.dg-fill-ok{fill:var(--dg-ok)}
.dg-tx-ok{fill:var(--dg-ok)}
.dg-line.dg-ok{stroke:var(--dg-ok)}
.dg-ah.dg-ok{fill:var(--dg-ok)}
.dg-box.dg-id{fill:var(--dg-id-soft);stroke:var(--dg-id)}
.dg-grp.dg-id{stroke:var(--dg-id)}
.dg-fill-id{fill:var(--dg-id)}
.dg-tx-id{fill:var(--dg-id)}
.dg-line.dg-id{stroke:var(--dg-id)}
.dg-ah.dg-id{fill:var(--dg-id)}
.dg-box.dg-net{fill:var(--dg-net-soft);stroke:var(--dg-net)}
.dg-grp.dg-net{stroke:var(--dg-net)}
.dg-fill-net{fill:var(--dg-net)}
.dg-tx-net{fill:var(--dg-net)}
.dg-line.dg-net{stroke:var(--dg-net)}
.dg-ah.dg-net{fill:var(--dg-net)}
.dg-box.dg-warn{fill:var(--dg-warn-soft);stroke:var(--dg-warn)}
.dg-grp.dg-warn{stroke:var(--dg-warn)}
.dg-fill-warn{fill:var(--dg-warn)}
.dg-tx-warn{fill:var(--dg-warn)}
.dg-line.dg-warn{stroke:var(--dg-warn)}
.dg-ah.dg-warn{fill:var(--dg-warn)}
.dg-box.dg-danger{fill:var(--dg-danger-soft);stroke:var(--dg-danger)}
.dg-grp.dg-danger{stroke:var(--dg-danger)}
.dg-fill-danger{fill:var(--dg-danger)}
.dg-tx-danger{fill:var(--dg-danger)}
.dg-line.dg-danger{stroke:var(--dg-danger)}
.dg-ah.dg-danger{fill:var(--dg-danger)}
.dg-on{fill:#fff}</style><defs><marker id="account-hierarchy-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="account-hierarchy-ah-aws" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-aws"/></marker><marker id="account-hierarchy-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="account-hierarchy-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker></defs><rect width="960" height="620" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">계정 · 리전 · 가용 영역 구조 비교</text>
<text x="24" y="54" font-size="12.5" class="dg-m">같은 높이의 상자끼리 대응합니다. 주황색이 AWS, 파란색이 Azure 입니다.</text>
<rect x="24" y="96" width="380" height="66" rx="10" class="dg-box dg-aws"/>
<text x="36" y="120" font-size="14" class="dg-t dg-b" data-w="356">AWS Organizations</text>
<text x="36" y="138" font-size="12" class="dg-m" data-w="356">루트 · 조직 전체</text>
<rect x="556" y="96" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="120" font-size="14" class="dg-t dg-b" data-w="356">Entra 테넌트 · 루트 관리 그룹</text>
<text x="568" y="138" font-size="12" class="dg-m" data-w="356">디렉터리(사용자·앱) + 구독을 묶는 최상위</text>
<path d="M404 129 L556 129" class="dg-line dg-dash"/>
<rect x="464" y="114" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="136" font-size="22" text-anchor="middle" class="dg-m dg-b">≈</text>
<path d="M214 162 L214 184" class="dg-line dg-aws" marker-end="url(#account-hierarchy-ah-aws)"/>
<path d="M746 162 L746 184" class="dg-line dg-azure" marker-end="url(#account-hierarchy-ah-azure)"/>
<rect x="24" y="184" width="380" height="66" rx="10" class="dg-box dg-aws"/>
<text x="36" y="208" font-size="14" class="dg-t dg-b" data-w="356">OU (조직 단위)</text>
<text x="36" y="226" font-size="12" class="dg-m" data-w="356">SCP 를 상속</text>
<rect x="556" y="184" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="208" font-size="14" class="dg-t dg-b" data-w="356">관리 그룹</text>
<text x="568" y="226" font-size="12" class="dg-m" data-w="356">Azure Policy · 역할 할당이 하위로 상속</text>
<path d="M404 217 L556 217" class="dg-line dg-dash"/>
<rect x="464" y="202" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="224" font-size="22" text-anchor="middle" class="dg-m dg-b">≈</text>
<path d="M214 250 L214 272" class="dg-line dg-aws" marker-end="url(#account-hierarchy-ah-aws)"/>
<path d="M746 250 L746 272" class="dg-line dg-azure" marker-end="url(#account-hierarchy-ah-azure)"/>
<rect x="24" y="272" width="380" height="66" rx="10" class="dg-box dg-aws"/>
<text x="36" y="296" font-size="14" class="dg-t dg-b" data-w="356">계정 (Account)</text>
<text x="36" y="314" font-size="12" class="dg-m" data-w="356">청구 · 격리 · 권한 경계</text>
<rect x="556" y="272" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="296" font-size="14" class="dg-t dg-b" data-w="356">구독 (Subscription)</text>
<text x="568" y="314" font-size="12" class="dg-m" data-w="356">청구 · 쿼터(vCPU) 경계</text>
<path d="M404 305 L556 305" class="dg-line dg-dash"/>
<rect x="464" y="290" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="312" font-size="22" text-anchor="middle" class="dg-m dg-b">≈</text>
<path d="M214 338 L214 360" class="dg-line dg-aws" marker-end="url(#account-hierarchy-ah-aws)"/>
<path d="M746 338 L746 360" class="dg-line dg-azure" marker-end="url(#account-hierarchy-ah-azure)"/>
<rect x="24" y="360" width="380" height="66" rx="10" class="dg-box dg-dash"/>
<text x="36" y="384" font-size="14" class="dg-t dg-b" data-w="356">(해당 계층 없음)</text>
<text x="36" y="402" font-size="12" class="dg-m" data-w="356">리소스는 계정 안에 바로 생성</text>
<rect x="556" y="360" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="384" font-size="14" class="dg-t dg-b" data-w="356">리소스 그룹 (Resource Group)</text>
<text x="568" y="402" font-size="12" class="dg-m" data-w="356">수명주기 · 삭제 · RBAC · 태그 단위</text>
<path d="M404 393 L556 393" class="dg-line dg-warn dg-dash"/>
<rect x="464" y="378" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="400" font-size="22" text-anchor="middle" class="dg-tx-warn dg-b">+</text>
<path d="M214 426 L214 448" class="dg-line dg-aws" marker-end="url(#account-hierarchy-ah-aws)"/>
<path d="M746 426 L746 448" class="dg-line dg-azure" marker-end="url(#account-hierarchy-ah-azure)"/>
<rect x="24" y="448" width="380" height="66" rx="10" class="dg-box dg-aws"/>
<text x="36" y="472" font-size="14" class="dg-t dg-b" data-w="356">VPC</text>
<text x="36" y="490" font-size="12" class="dg-m" data-w="356">리전 단위 · 서브넷은 AZ 에 고정</text>
<rect x="556" y="448" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="472" font-size="14" class="dg-t dg-b" data-w="356">VNet</text>
<text x="568" y="490" font-size="12" class="dg-m" data-w="356">리전 단위 · 서브넷은 리전 전체에 걸침</text>
<path d="M404 481 L556 481" class="dg-line dg-dash"/>
<rect x="464" y="466" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="488" font-size="22" text-anchor="middle" class="dg-m dg-b">≈</text>
<path d="M214 514 L214 536" class="dg-line dg-aws" marker-end="url(#account-hierarchy-ah-aws)"/>
<path d="M746 514 L746 536" class="dg-line dg-azure" marker-end="url(#account-hierarchy-ah-azure)"/>
<rect x="24" y="536" width="380" height="66" rx="10" class="dg-box dg-aws"/>
<text x="36" y="560" font-size="14" class="dg-t dg-b" data-w="356">AZ (a · b · c)</text>
<text x="36" y="578" font-size="12" class="dg-m" data-w="356">서브넷마다 AZ 를 지정</text>
<rect x="556" y="536" width="380" height="66" rx="10" class="dg-box dg-azure"/>
<text x="568" y="560" font-size="14" class="dg-t dg-b" data-w="356">가용 영역 (1 · 2 · 3)</text>
<text x="568" y="578" font-size="12" class="dg-m" data-w="356">노드 풀 · VM · LB 의 속성으로 지정</text>
<path d="M404 569 L556 569" class="dg-line dg-dash"/>
<rect x="464" y="554" width="32" height="30" rx="8" class="dg-chip"/>
<text x="480" y="576" font-size="22" text-anchor="middle" class="dg-m dg-b">≈</text>
<rect x="844" y="349" width="85" height="22" rx="11" class="dg-box dg-warn"/>
<text x="886.5" y="364" font-size="11" text-anchor="middle" class="dg-tx-warn dg-b">AWS 에 없음</text>
</svg>
