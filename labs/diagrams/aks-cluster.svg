.dg-on{fill:#fff}</style><defs><marker id="aks-cluster-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="aks-cluster-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="aks-cluster-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker><marker id="aks-cluster-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="aks-cluster-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="aks-cluster-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker></defs><rect width="960" height="690" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">AKS cluster layout (Standard)</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Azure runs the control plane (as with EKS); nodes are VMSS in a separate &quot;node resource group&quot; in your subscription.</text>
<rect x="24" y="92" width="452" height="128" rx="14" class="dg-grp dg-ok"/>
<text x="38" y="112" font-size="12.5" class="dg-tx-ok dg-b" data-w="424">Control plane · run by Azure, outside your subscription</text>
<rect x="36" y="124" width="100" height="44" rx="10" class="dg-box dg-ok"/>
<text x="86" y="142.5" font-size="12.5" text-anchor="middle" class="dg-t dg-b" data-w="84">API server</text>
<rect x="144" y="124" width="100" height="44" rx="10" class="dg-box dg-ok"/>
<text x="194" y="142.5" font-size="12.5" text-anchor="middle" class="dg-t dg-b" data-w="84">etcd</text>
<rect x="252" y="124" width="100" height="44" rx="10" class="dg-box dg-ok"/>
<text x="302" y="142.5" font-size="12.5" text-anchor="middle" class="dg-t dg-b" data-w="84">scheduler</text>
<rect x="360" y="124" width="100" height="44" rx="10" class="dg-box dg-ok"/>
<text x="410" y="142.5" font-size="12.5" text-anchor="middle" class="dg-t dg-b" data-w="84">controller</text>
<text x="40" y="196" font-size="11.5" class="dg-m" data-w="420">Standard tier: uptime SLA (99.95% when using zones)</text>
<rect x="488" y="92" width="448" height="128" rx="14" class="dg-grp dg-id"/>
<text x="502" y="112" font-size="12.5" class="dg-tx-id dg-b" data-w="420">Identity · access</text>
<rect x="500" y="124" width="212" height="84" rx="10" class="dg-box dg-id"/>
<text x="510" y="144.5" font-size="12.5" class="dg-t dg-b" data-w="192">Entra ID + Azure RBAC</text>
<text x="510" y="161" font-size="11" class="dg-m" data-w="192">kubectl uses the az login token</text>
<text x="510" y="177" font-size="11" class="dg-m" data-w="192">Local accounts disabled</text>
<text x="510" y="193" font-size="11" class="dg-m" data-w="192">(no static kubeconfig)</text>
<rect x="722" y="124" width="202" height="84" rx="10" class="dg-box dg-id"/>
<text x="732" y="144.5" font-size="12.5" class="dg-t dg-b" data-w="182">OIDC issuer</text>
<text x="732" y="161" font-size="11" class="dg-m" data-w="182">Trust anchor for</text>
<text x="732" y="177" font-size="11" class="dg-m" data-w="182">Workload Identity (Lab 06)</text>
<rect x="24" y="236" width="912" height="40" rx="10" class="dg-box dg-net"/>
<text x="480" y="256.5" font-size="12.5" text-anchor="middle" class="dg-t dg-b" data-w="892">API Server VNet Integration: API server projected into snet-aks-apiserver (10.10.1.0/28, delegated) · authorized IPs only</text>
<path d="M250 220 L250 236" class="dg-line dg-net" marker-end="url(#aks-cluster-ah-net)"/>
<path d="M250 276 L250 296" class="dg-line dg-net" marker-end="url(#aks-cluster-ah-net)"/>
<rect x="24" y="296" width="912" height="252" rx="14" class="dg-grp dg-azure dg-dash"/>
<text x="38" y="316" font-size="12.5" class="dg-tx-azure dg-b" data-w="884">Your subscription · node resource group rg-…-aks-nodes (managed by AKS · do not modify) · snet-aks-nodes 10.10.0.0/24</text>
<rect x="36" y="326" width="288" height="150" rx="14" class="dg-grp"/>
<text x="50" y="346" font-size="12" class="dg-m dg-b" data-w="260">Zone 1</text>
<rect x="46" y="352" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="54" y="371" font-size="13" class="dg-t dg-b" data-w="252">system node</text>
<text x="54" y="388" font-size="11" class="dg-m" data-w="252">D4ds_v5 · CriticalAddonsOnly taint</text>
<rect x="46" y="412" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="54" y="431" font-size="13" class="dg-t dg-b" data-w="252">user node</text>
<text x="54" y="448" font-size="11" class="dg-m" data-w="252">D4ds_v5 · app workloads</text>
<rect x="336" y="326" width="288" height="150" rx="14" class="dg-grp"/>
<text x="350" y="346" font-size="12" class="dg-m dg-b" data-w="260">Zone 2</text>
<rect x="346" y="352" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="354" y="371" font-size="13" class="dg-t dg-b" data-w="252">system node</text>
<text x="354" y="388" font-size="11" class="dg-m" data-w="252">D4ds_v5 · CriticalAddonsOnly taint</text>
<rect x="346" y="412" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="354" y="431" font-size="13" class="dg-t dg-b" data-w="252">user node</text>
<text x="354" y="448" font-size="11" class="dg-m" data-w="252">D4ds_v5 · app workloads</text>
<rect x="636" y="326" width="288" height="150" rx="14" class="dg-grp"/>
<text x="650" y="346" font-size="12" class="dg-m dg-b" data-w="260">Zone 3</text>
<rect x="646" y="352" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="654" y="371" font-size="13" class="dg-t dg-b" data-w="252">system node</text>
<text x="654" y="388" font-size="11" class="dg-m" data-w="252">D4ds_v5 · CriticalAddonsOnly taint</text>
<rect x="646" y="412" width="268" height="52" rx="10" class="dg-box dg-azure"/>
<text x="654" y="431" font-size="13" class="dg-t dg-b" data-w="252">user node</text>
<text x="654" y="448" font-size="11" class="dg-m" data-w="252">D4ds_v5 · app workloads</text>
<text x="40" y="498" font-size="11.5" class="dg-m" data-w="880">system pool 3–5 · user pool 3–6 · both use the Cluster Autoscaler (node count is not fixed in code) · AzureLinux3 + ephemeral OS disk</text>
<text x="40" y="520" font-size="11.5" class="dg-m" data-w="880">Optional: spot pool (0–5, equivalent to EC2 Spot) · Network: Azure CNI Overlay + Cilium · Pod CIDR 10.244.0.0/16 · outbound via NAT Gateway</text>
<rect x="24" y="562" width="912" height="112" rx="14" class="dg-grp"/>
<text x="38" y="582" font-size="12" class="dg-m dg-b" data-w="884">Add-ons (kube-system etc.)</text>
<rect x="40" y="592" width="211" height="24" rx="12" class="dg-box dg-azure"/>
<text x="145.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">Cilium (CNI · NetworkPolicy)</text>
<rect x="259" y="592" width="73" height="24" rx="12" class="dg-box dg-azure"/>
<text x="295.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">CoreDNS</text>
<rect x="340" y="592" width="111" height="24" rx="12" class="dg-box dg-id"/>
<text x="395.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-id dg-b">Key Vault CSI</text>
<rect x="459" y="592" width="189" height="24" rx="12" class="dg-box dg-warn"/>
<text x="553.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-warn dg-b">Azure Policy (Gatekeeper)</text>
<rect x="656" y="592" width="52" height="24" rx="12" class="dg-box dg-ok"/>
<text x="682" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">KEDA</text>
<rect x="716" y="592" width="43" height="24" rx="12" class="dg-box dg-ok"/>
<text x="737.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">VPA</text>
<rect x="767" y="592" width="73" height="24" rx="12" class="dg-box dg-net"/>
<text x="803.5" y="608.1" font-size="11.5" text-anchor="middle" class="dg-tx-net dg-b">ama-logs</text>
<rect x="40" y="624" width="94" height="24" rx="12" class="dg-box dg-net"/>
<text x="87" y="640.1" font-size="11.5" text-anchor="middle" class="dg-tx-net dg-b">ama-metrics</text>
<rect x="142" y="624" width="110" height="24" rx="12" class="dg-box dg-ok"/>
<text x="197" y="640.1" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">Image Cleaner</text>
<rect x="260" y="624" width="223" height="24" rx="12" class="dg-box dg-azure"/>
<text x="371.5" y="640.1" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">Gateway API (approuting-istio)</text>
</svg>
