.dg-on{fill:#fff}</style><defs><marker id="aws-azure-map-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="aws-azure-map-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker><marker id="aws-azure-map-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="aws-azure-map-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="aws-azure-map-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker><marker id="aws-azure-map-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker></defs><rect width="960" height="888" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">AWS ↔ Azure 서비스 대응 지도</text>
<text x="24" y="54" font-size="12.5" class="dg-m">왼쪽이 AWS, 오른쪽이 Azure 입니다. 노란 ! 는 이름만 비슷하고 개념이 다른 항목 — Lab 00 의 설명을 꼭 읽어 보세요.</text>
<rect x="24" y="96" width="456" height="236" rx="10" class="dg-box"/>
<text x="40" y="123" font-size="14.5" class="dg-t dg-b">조직 · 계정</text>
<text x="40" y="160" font-size="12.5" class="dg-tx-aws" data-w="176">Organizations 루트</text>
<text x="228" y="160" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="160" font-size="12.5" class="dg-tx-azure" data-w="198">Entra 테넌트 · 루트 관리 그룹</text>
<path d="M38 170 L466 170" class="dg-line dg-dash"/>
<text x="40" y="190" font-size="12.5" class="dg-tx-aws" data-w="176">OU</text>
<text x="228" y="190" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="190" font-size="12.5" class="dg-tx-azure" data-w="198">관리 그룹</text>
<path d="M38 200 L466 200" class="dg-line dg-dash"/>
<text x="40" y="220" font-size="12.5" class="dg-tx-aws" data-w="176">계정 (Account)</text>
<text x="228" y="220" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="220" font-size="12.5" class="dg-tx-azure" data-w="198">구독 (Subscription)</text>
<circle cx="460" cy="216" r="9" class="dg-fill-warn"/>
<text x="460" y="220.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 230 L466 230" class="dg-line dg-dash"/>
<text x="40" y="250" font-size="12.5" class="dg-m" data-w="176">(없음)</text>
<text x="228" y="250" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="250" font-size="12.5" class="dg-tx-azure" data-w="198">리소스 그룹 (RG)</text>
<circle cx="460" cy="246" r="9" class="dg-fill-warn"/>
<text x="460" y="250.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 260 L466 260" class="dg-line dg-dash"/>
<text x="40" y="280" font-size="12.5" class="dg-tx-aws" data-w="176">SCP</text>
<text x="228" y="280" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="280" font-size="12.5" class="dg-tx-azure" data-w="198">Azure Policy + RBAC</text>
<circle cx="460" cy="276" r="9" class="dg-fill-warn"/>
<text x="460" y="280.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 290 L466 290" class="dg-line dg-dash"/>
<text x="40" y="310" font-size="12.5" class="dg-tx-aws" data-w="176">태그 · ARN</text>
<text x="228" y="310" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="310" font-size="12.5" class="dg-tx-azure" data-w="198">태그 · 리소스 ID</text>
<rect x="496" y="96" width="456" height="236" rx="10" class="dg-box dg-net"/>
<text x="512" y="123" font-size="14.5" class="dg-tx-net dg-b">네트워크</text>
<text x="512" y="160" font-size="12.5" class="dg-tx-aws" data-w="176">VPC</text>
<text x="700" y="160" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="160" font-size="12.5" class="dg-tx-azure" data-w="198">Virtual Network (VNet)</text>
<path d="M510 170 L938 170" class="dg-line dg-dash"/>
<text x="512" y="190" font-size="12.5" class="dg-tx-aws" data-w="176">Subnet (AZ 고정)</text>
<text x="700" y="190" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="190" font-size="12.5" class="dg-tx-azure" data-w="198">Subnet (AZ 비종속)</text>
<circle cx="932" cy="186" r="9" class="dg-fill-warn"/>
<text x="932" y="190.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 200 L938 200" class="dg-line dg-dash"/>
<text x="512" y="220" font-size="12.5" class="dg-tx-aws" data-w="176">Security Group · NACL</text>
<text x="700" y="220" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="220" font-size="12.5" class="dg-tx-azure" data-w="198">NSG</text>
<path d="M510 230 L938 230" class="dg-line dg-dash"/>
<text x="512" y="250" font-size="12.5" class="dg-tx-aws" data-w="176">NAT Gateway + EIP</text>
<text x="700" y="250" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="250" font-size="12.5" class="dg-tx-azure" data-w="198">NAT Gateway (서브넷에 연결)</text>
<circle cx="932" cy="246" r="9" class="dg-fill-warn"/>
<text x="932" y="250.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 260 L938 260" class="dg-line dg-dash"/>
<text x="512" y="280" font-size="12.5" class="dg-tx-aws" data-w="176">VPC Endpoint</text>
<text x="700" y="280" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="280" font-size="12.5" class="dg-tx-azure" data-w="198">Private Endpoint + DNS Zone</text>
<circle cx="932" cy="276" r="9" class="dg-fill-warn"/>
<text x="932" y="280.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 290 L938 290" class="dg-line dg-dash"/>
<text x="512" y="310" font-size="12.5" class="dg-tx-aws" data-w="176">ALB · NLB</text>
<text x="700" y="310" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="310" font-size="12.5" class="dg-tx-azure" data-w="198">App GW · LB · Front Door</text>
<rect x="24" y="348" width="456" height="266" rx="10" class="dg-box dg-azure"/>
<text x="40" y="375" font-size="14.5" class="dg-tx-azure dg-b">컨테이너 (EKS ↔ AKS)</text>
<text x="40" y="412" font-size="12.5" class="dg-tx-aws" data-w="176">EKS</text>
<text x="228" y="412" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="412" font-size="12.5" class="dg-tx-azure" data-w="198">AKS (Standard 티어 = SLA)</text>
<path d="M38 422 L466 422" class="dg-line dg-dash"/>
<text x="40" y="442" font-size="12.5" class="dg-tx-aws" data-w="176">EKS Auto Mode</text>
<text x="228" y="442" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="442" font-size="12.5" class="dg-tx-azure" data-w="198">AKS Automatic</text>
<path d="M38 452 L466 452" class="dg-line dg-dash"/>
<text x="40" y="472" font-size="12.5" class="dg-tx-aws" data-w="176">Managed node group</text>
<text x="228" y="472" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="472" font-size="12.5" class="dg-tx-azure" data-w="198">Node pool (VMSS)</text>
<path d="M38 482 L466 482" class="dg-line dg-dash"/>
<text x="40" y="502" font-size="12.5" class="dg-tx-aws" data-w="176">Karpenter</text>
<text x="228" y="502" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="502" font-size="12.5" class="dg-tx-azure" data-w="198">NAP (노드 자동 프로비저닝)</text>
<path d="M38 512 L466 512" class="dg-line dg-dash"/>
<text x="40" y="532" font-size="12.5" class="dg-tx-aws" data-w="176">VPC CNI</text>
<text x="228" y="532" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="532" font-size="12.5" class="dg-tx-azure" data-w="198">CNI Overlay + Cilium</text>
<circle cx="460" cy="528" r="9" class="dg-fill-warn"/>
<text x="460" y="532.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 542 L466 542" class="dg-line dg-dash"/>
<text x="40" y="562" font-size="12.5" class="dg-tx-aws" data-w="176">AWS LB Controller</text>
<text x="228" y="562" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="562" font-size="12.5" class="dg-tx-azure" data-w="198">Gateway API (App Routing)</text>
<path d="M38 572 L466 572" class="dg-line dg-dash"/>
<text x="40" y="592" font-size="12.5" class="dg-tx-aws" data-w="176">ECR</text>
<text x="228" y="592" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="592" font-size="12.5" class="dg-tx-azure" data-w="198">ACR</text>
<rect x="496" y="348" width="456" height="266" rx="10" class="dg-box dg-id"/>
<text x="512" y="375" font-size="14.5" class="dg-tx-id dg-b">ID · 보안 · 시크릿</text>
<text x="512" y="412" font-size="12.5" class="dg-tx-aws" data-w="176">IAM User · SSO</text>
<text x="700" y="412" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="412" font-size="12.5" class="dg-tx-azure" data-w="198">Microsoft Entra ID</text>
<path d="M510 422 L938 422" class="dg-line dg-dash"/>
<text x="512" y="442" font-size="12.5" class="dg-tx-aws" data-w="176">IAM Role + Policy</text>
<text x="700" y="442" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="442" font-size="12.5" class="dg-tx-azure" data-w="198">Managed Identity + 역할 할당</text>
<circle cx="932" cy="438" r="9" class="dg-fill-warn"/>
<text x="932" y="442.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 452 L938 452" class="dg-line dg-dash"/>
<text x="512" y="472" font-size="12.5" class="dg-tx-aws" data-w="176">IRSA · Pod Identity</text>
<text x="700" y="472" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="472" font-size="12.5" class="dg-tx-azure" data-w="198">Workload Identity</text>
<path d="M510 482 L938 482" class="dg-line dg-dash"/>
<text x="512" y="502" font-size="12.5" class="dg-tx-aws" data-w="176">EKS access entries</text>
<text x="700" y="502" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="502" font-size="12.5" class="dg-tx-azure" data-w="198">Azure RBAC for Kubernetes</text>
<path d="M510 512 L938 512" class="dg-line dg-dash"/>
<text x="512" y="532" font-size="12.5" class="dg-tx-aws" data-w="176">KMS · Secrets Manager</text>
<text x="700" y="532" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="532" font-size="12.5" class="dg-tx-azure" data-w="198">Key Vault</text>
<path d="M510 542 L938 542" class="dg-line dg-dash"/>
<text x="512" y="562" font-size="12.5" class="dg-tx-aws" data-w="176">GuardDuty · Inspector</text>
<text x="700" y="562" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="562" font-size="12.5" class="dg-tx-azure" data-w="198">Defender for Containers</text>
<rect x="24" y="630" width="456" height="206" rx="10" class="dg-box dg-ok"/>
<text x="40" y="657" font-size="14.5" class="dg-tx-ok dg-b">관측 · 거버넌스 · 비용</text>
<text x="40" y="694" font-size="12.5" class="dg-tx-aws" data-w="176">CloudWatch Logs</text>
<text x="228" y="694" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="694" font-size="12.5" class="dg-tx-azure" data-w="198">Log Analytics</text>
<path d="M38 704 L466 704" class="dg-line dg-dash"/>
<text x="40" y="724" font-size="12.5" class="dg-tx-aws" data-w="176">AMP · AMG</text>
<text x="228" y="724" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="724" font-size="12.5" class="dg-tx-azure" data-w="198">관리형 Prometheus · Grafana</text>
<path d="M38 734 L466 734" class="dg-line dg-dash"/>
<text x="40" y="754" font-size="12.5" class="dg-tx-aws" data-w="176">CloudTrail</text>
<text x="228" y="754" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="754" font-size="12.5" class="dg-tx-azure" data-w="198">Activity Log + 진단 설정</text>
<path d="M38 764 L466 764" class="dg-line dg-dash"/>
<text x="40" y="784" font-size="12.5" class="dg-tx-aws" data-w="176">AWS Config · Kyverno</text>
<text x="228" y="784" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="784" font-size="12.5" class="dg-tx-azure" data-w="198">Azure Policy (Gatekeeper)</text>
<path d="M38 794 L466 794" class="dg-line dg-dash"/>
<text x="40" y="814" font-size="12.5" class="dg-tx-aws" data-w="176">Budgets · Cost Explorer</text>
<text x="228" y="814" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="248" y="814" font-size="12.5" class="dg-tx-azure" data-w="198">Cost Management 예산</text>
<rect x="496" y="630" width="456" height="206" rx="10" class="dg-box dg-warn"/>
<text x="512" y="657" font-size="14.5" class="dg-tx-warn dg-b">Terraform · 상태</text>
<text x="512" y="694" font-size="12.5" class="dg-tx-aws" data-w="176">S3 + DynamoDB (락)</text>
<text x="700" y="694" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="720" y="694" font-size="12.5" class="dg-tx-azure" data-w="198">Blob Storage (blob lease)</text>
<path d="M510 704 L938 704" class="dg-line dg-dash"/>
<text x="512" y="724" font-size="12.5" class="dg-tx-aws" data-w="176">provider aws · awscc</text>
<text x="700" y="724" font-size="13" text-anchor="middle" class="dg-m">↔</text>
