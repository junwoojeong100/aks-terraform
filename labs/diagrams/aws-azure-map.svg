.dg-on{fill:#fff}</style><defs><marker id="aws-azure-map-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="aws-azure-map-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker><marker id="aws-azure-map-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="aws-azure-map-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="aws-azure-map-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker><marker id="aws-azure-map-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker></defs><rect width="960" height="888" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">AWS ↔ Azure service map</text>
<text x="24" y="54" font-size="12.5" class="dg-m">AWS is on the left, Azure on the right. A yellow ! marks look-alike names with different concepts — be sure to read Lab 00.</text>
<rect x="24" y="96" width="456" height="236" rx="10" class="dg-box"/>
<text x="40" y="123" font-size="14.5" class="dg-t dg-b">Organization · accounts</text>
<text x="40" y="160" font-size="12.5" class="dg-tx-aws" data-w="170">Organizations root</text>
<text x="219" y="160" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="160" font-size="12.5" class="dg-tx-azure" data-w="228">Tenant · root management group</text>
<path d="M38 170 L466 170" class="dg-line dg-dash"/>
<text x="40" y="190" font-size="12.5" class="dg-tx-aws" data-w="170">OU</text>
<text x="219" y="190" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="190" font-size="12.5" class="dg-tx-azure" data-w="228">Management group</text>
<path d="M38 200 L466 200" class="dg-line dg-dash"/>
<text x="40" y="220" font-size="12.5" class="dg-tx-aws" data-w="170">Account</text>
<text x="219" y="220" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="220" font-size="12.5" class="dg-tx-azure" data-w="211">Subscription</text>
<circle cx="460" cy="216" r="9" class="dg-fill-warn"/>
<text x="460" y="220.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 230 L466 230" class="dg-line dg-dash"/>
<text x="40" y="250" font-size="12.5" class="dg-m" data-w="170">(none)</text>
<text x="219" y="250" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="250" font-size="12.5" class="dg-tx-azure" data-w="211">Resource group (RG)</text>
<circle cx="460" cy="246" r="9" class="dg-fill-warn"/>
<text x="460" y="250.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 260 L466 260" class="dg-line dg-dash"/>
<text x="40" y="280" font-size="12.5" class="dg-tx-aws" data-w="170">SCP</text>
<text x="219" y="280" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="280" font-size="12.5" class="dg-tx-azure" data-w="211">Azure Policy + RBAC</text>
<circle cx="460" cy="276" r="9" class="dg-fill-warn"/>
<text x="460" y="280.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 290 L466 290" class="dg-line dg-dash"/>
<text x="40" y="310" font-size="12.5" class="dg-tx-aws" data-w="170">Tags · ARN</text>
<text x="219" y="310" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="310" font-size="12.5" class="dg-tx-azure" data-w="228">Tags · resource ID</text>
<rect x="496" y="96" width="456" height="236" rx="10" class="dg-box dg-net"/>
<text x="512" y="123" font-size="14.5" class="dg-tx-net dg-b">Networking</text>
<text x="512" y="160" font-size="12.5" class="dg-tx-aws" data-w="170">VPC</text>
<text x="691" y="160" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="160" font-size="12.5" class="dg-tx-azure" data-w="228">Virtual Network (VNet)</text>
<path d="M510 170 L938 170" class="dg-line dg-dash"/>
<text x="512" y="190" font-size="12.5" class="dg-tx-aws" data-w="170">Subnet (tied to one AZ)</text>
<text x="691" y="190" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="190" font-size="12.5" class="dg-tx-azure" data-w="211">Subnet (not tied to an AZ)</text>
<circle cx="932" cy="186" r="9" class="dg-fill-warn"/>
<text x="932" y="190.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 200 L938 200" class="dg-line dg-dash"/>
<text x="512" y="220" font-size="12.5" class="dg-tx-aws" data-w="170">Security Group · NACL</text>
<text x="691" y="220" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="220" font-size="12.5" class="dg-tx-azure" data-w="228">NSG</text>
<path d="M510 230 L938 230" class="dg-line dg-dash"/>
<text x="512" y="250" font-size="12.5" class="dg-tx-aws" data-w="170">NAT Gateway + EIP</text>
<text x="691" y="250" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="250" font-size="12.5" class="dg-tx-azure" data-w="211">NAT Gateway (subnet-attached)</text>
<circle cx="932" cy="246" r="9" class="dg-fill-warn"/>
<text x="932" y="250.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 260 L938 260" class="dg-line dg-dash"/>
<text x="512" y="280" font-size="12.5" class="dg-tx-aws" data-w="170">VPC Endpoint</text>
<text x="691" y="280" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="280" font-size="12.5" class="dg-tx-azure" data-w="211">Private Endpoint + DNS Zone</text>
<circle cx="932" cy="276" r="9" class="dg-fill-warn"/>
<text x="932" y="280.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 290 L938 290" class="dg-line dg-dash"/>
<text x="512" y="310" font-size="12.5" class="dg-tx-aws" data-w="170">ALB · NLB</text>
<text x="691" y="310" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="310" font-size="12.5" class="dg-tx-azure" data-w="228">App GW · LB · Front Door</text>
<rect x="24" y="348" width="456" height="266" rx="10" class="dg-box dg-azure"/>
<text x="40" y="375" font-size="14.5" class="dg-tx-azure dg-b">Containers (EKS ↔ AKS)</text>
<text x="40" y="412" font-size="12.5" class="dg-tx-aws" data-w="170">EKS</text>
<text x="219" y="412" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="412" font-size="12.5" class="dg-tx-azure" data-w="228">AKS (Standard tier = SLA)</text>
<path d="M38 422 L466 422" class="dg-line dg-dash"/>
<text x="40" y="442" font-size="12.5" class="dg-tx-aws" data-w="170">EKS Auto Mode</text>
<text x="219" y="442" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="442" font-size="12.5" class="dg-tx-azure" data-w="228">AKS Automatic</text>
<path d="M38 452 L466 452" class="dg-line dg-dash"/>
<text x="40" y="472" font-size="12.5" class="dg-tx-aws" data-w="170">Managed node group</text>
<text x="219" y="472" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="472" font-size="12.5" class="dg-tx-azure" data-w="228">Node pool (VMSS)</text>
<path d="M38 482 L466 482" class="dg-line dg-dash"/>
<text x="40" y="502" font-size="12.5" class="dg-tx-aws" data-w="170">Karpenter</text>
<text x="219" y="502" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="502" font-size="12.5" class="dg-tx-azure" data-w="228">NAP (node auto-provisioning)</text>
<path d="M38 512 L466 512" class="dg-line dg-dash"/>
<text x="40" y="532" font-size="12.5" class="dg-tx-aws" data-w="170">VPC CNI</text>
<text x="219" y="532" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="532" font-size="12.5" class="dg-tx-azure" data-w="211">CNI Overlay + Cilium</text>
<circle cx="460" cy="528" r="9" class="dg-fill-warn"/>
<text x="460" y="532.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M38 542 L466 542" class="dg-line dg-dash"/>
<text x="40" y="562" font-size="12.5" class="dg-tx-aws" data-w="170">AWS LB Controller</text>
<text x="219" y="562" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="562" font-size="12.5" class="dg-tx-azure" data-w="228">Gateway API (App Routing)</text>
<path d="M38 572 L466 572" class="dg-line dg-dash"/>
<text x="40" y="592" font-size="12.5" class="dg-tx-aws" data-w="170">ECR</text>
<text x="219" y="592" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="592" font-size="12.5" class="dg-tx-azure" data-w="228">ACR</text>
<rect x="496" y="348" width="456" height="266" rx="10" class="dg-box dg-id"/>
<text x="512" y="375" font-size="14.5" class="dg-tx-id dg-b">Identity · security · secrets</text>
<text x="512" y="412" font-size="12.5" class="dg-tx-aws" data-w="170">IAM User · SSO</text>
<text x="691" y="412" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="412" font-size="12.5" class="dg-tx-azure" data-w="228">Microsoft Entra ID</text>
<path d="M510 422 L938 422" class="dg-line dg-dash"/>
<text x="512" y="442" font-size="12.5" class="dg-tx-aws" data-w="170">IAM Role + Policy</text>
<text x="691" y="442" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="442" font-size="12.5" class="dg-tx-azure" data-w="211">Managed Identity + RBAC role</text>
<circle cx="932" cy="438" r="9" class="dg-fill-warn"/>
<text x="932" y="442.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<path d="M510 452 L938 452" class="dg-line dg-dash"/>
<text x="512" y="472" font-size="12.5" class="dg-tx-aws" data-w="170">IRSA · Pod Identity</text>
<text x="691" y="472" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="472" font-size="12.5" class="dg-tx-azure" data-w="228">Workload Identity</text>
<path d="M510 482 L938 482" class="dg-line dg-dash"/>
<text x="512" y="502" font-size="12.5" class="dg-tx-aws" data-w="170">EKS access entries</text>
<text x="691" y="502" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="502" font-size="12.5" class="dg-tx-azure" data-w="228">Azure RBAC for Kubernetes</text>
<path d="M510 512 L938 512" class="dg-line dg-dash"/>
<text x="512" y="532" font-size="12.5" class="dg-tx-aws" data-w="170">KMS · Secrets Manager</text>
<text x="691" y="532" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="532" font-size="12.5" class="dg-tx-azure" data-w="228">Key Vault</text>
<path d="M510 542 L938 542" class="dg-line dg-dash"/>
<text x="512" y="562" font-size="12.5" class="dg-tx-aws" data-w="170">GuardDuty · Inspector</text>
<text x="691" y="562" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="562" font-size="12.5" class="dg-tx-azure" data-w="228">Defender for Containers</text>
<rect x="24" y="630" width="456" height="206" rx="10" class="dg-box dg-ok"/>
<text x="40" y="657" font-size="14.5" class="dg-tx-ok dg-b">Observability · governance · cost</text>
<text x="40" y="694" font-size="12.5" class="dg-tx-aws" data-w="170">CloudWatch Logs</text>
<text x="219" y="694" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="694" font-size="12.5" class="dg-tx-azure" data-w="228">Log Analytics</text>
<path d="M38 704 L466 704" class="dg-line dg-dash"/>
<text x="40" y="724" font-size="12.5" class="dg-tx-aws" data-w="170">AMP · AMG</text>
<text x="219" y="724" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="724" font-size="12.5" class="dg-tx-azure" data-w="228">Managed Prometheus · Grafana</text>
<path d="M38 734 L466 734" class="dg-line dg-dash"/>
<text x="40" y="754" font-size="12.5" class="dg-tx-aws" data-w="170">CloudTrail</text>
<text x="219" y="754" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="754" font-size="12.5" class="dg-tx-azure" data-w="228">Activity Log + diagnostics</text>
<path d="M38 764 L466 764" class="dg-line dg-dash"/>
<text x="40" y="784" font-size="12.5" class="dg-tx-aws" data-w="170">AWS Config · Kyverno</text>
<text x="219" y="784" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="784" font-size="12.5" class="dg-tx-azure" data-w="228">Azure Policy (Gatekeeper)</text>
<path d="M38 794 L466 794" class="dg-line dg-dash"/>
<text x="40" y="814" font-size="12.5" class="dg-tx-aws" data-w="170">Budgets · Cost Explorer</text>
<text x="219" y="814" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="234" y="814" font-size="12.5" class="dg-tx-azure" data-w="228">Cost Management budgets</text>
<rect x="496" y="630" width="456" height="206" rx="10" class="dg-box dg-warn"/>
<text x="512" y="657" font-size="14.5" class="dg-tx-warn dg-b">Terraform · state</text>
<text x="512" y="694" font-size="12.5" class="dg-tx-aws" data-w="170">S3 + DynamoDB (lock)</text>
<text x="691" y="694" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="694" font-size="12.5" class="dg-tx-azure" data-w="228">Blob Storage (blob lease)</text>
<path d="M510 704 L938 704" class="dg-line dg-dash"/>
<text x="512" y="724" font-size="12.5" class="dg-tx-aws" data-w="170">provider aws · awscc</text>
<text x="691" y="724" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="724" font-size="12.5" class="dg-tx-azure" data-w="228">azurerm · azapi</text>
<path d="M510 734 L938 734" class="dg-line dg-dash"/>
<text x="512" y="754" font-size="12.5" class="dg-tx-aws" data-w="170">terraform-aws-modules</text>
<text x="691" y="754" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="754" font-size="12.5" class="dg-tx-azure" data-w="228">Azure Verified Modules</text>
<path d="M510 764 L938 764" class="dg-line dg-dash"/>
<text x="512" y="784" font-size="12.5" class="dg-tx-aws" data-w="170">AWS_PROFILE · SSO</text>
<text x="691" y="784" font-size="13" text-anchor="middle" class="dg-m">↔</text>
<text x="706" y="784" font-size="12.5" class="dg-tx-azure" data-w="228">az login + subscription env var</text>
<circle cx="40" cy="866" r="9" class="dg-fill-warn"/>
<text x="40" y="870.2" font-size="12" text-anchor="middle" class="dg-b dg-on">!</text>
<text x="58" y="871" font-size="12" class="dg-m" data-w="880">Similar names, different structure (e.g., subnets are not tied to an AZ, and resource groups add a new layer)</text>
