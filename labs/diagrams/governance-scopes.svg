<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="governance-scopes-t governance-scopes-d"><title id="governance-scopes-t">거버넌스는 어느 범위에 거는가</title><desc id="governance-scopes-d">관리 그룹, 구독, 리소스 그룹, AKS 클러스터로 이어지는 범위에 Azure Policy 이니셔티브, Defender 플랜과 예산, 리소스 잠금, Gatekeeper 가 어떻게 걸리는지 보여 준다.</desc><style>svg.dg{--dg-bg:#ffffff;--dg-fg:#1f2328;--dg-muted:#59636e;--dg-line:#6e7781;--dg-card:#f6f8fa;--dg-border:#d1d9e0;--dg-aws:#c2590a;--dg-aws-soft:#fff1e5;--dg-azure:#0b6ed0;--dg-azure-soft:#e5f1ff;--dg-ok:#1a7f37;--dg-ok-soft:#e6f6ea;--dg-id:#8250df;--dg-id-soft:#f3ecff;--dg-net:#0e7490;--dg-net-soft:#e0f4f8;--dg-warn:#9a6700;--dg-warn-soft:#fff6d6;--dg-danger:#cf222e;--dg-danger-soft:#ffebe9;font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif}
@media (prefers-color-scheme:dark){svg.dg{--dg-bg:#0d1117;--dg-fg:#e6edf3;--dg-muted:#9198a1;--dg-line:#8b949e;--dg-card:#151b23;--dg-border:#30363d;--dg-aws:#f0883e;--dg-aws-soft:#2b1c10;--dg-azure:#58a6ff;--dg-azure-soft:#0f2238;--dg-ok:#3fb950;--dg-ok-soft:#0f2417;--dg-id:#b392f0;--dg-id-soft:#221a36;--dg-net:#39c5cf;--dg-net-soft:#0d2a2f;--dg-warn:#d29922;--dg-warn-soft:#2d2208;--dg-danger:#ff7b72;--dg-danger-soft:#3a1517}}
.dg-bg{fill:var(--dg-bg)}
.dg-t{fill:var(--dg-fg)}
.dg-m{fill:var(--dg-muted)}
.dg-b{font-weight:650}
.dg-box,.dg-grp,.dg-chip{stroke-width:1.4}
