.dg-on{fill:#fff}</style><defs><marker id="governance-scopes-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="governance-scopes-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker><marker id="governance-scopes-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="governance-scopes-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="governance-scopes-ah-aws" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-aws"/></marker></defs><rect width="960" height="540" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">Where to apply governance: scopes</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Policies and role assignments are inherited downward. This lab assigns policies at the resource group (cluster RG) scope.</text>
<rect x="24" y="100" width="580" height="76" rx="10" class="dg-box"/>
<text x="36" y="124" font-size="14" class="dg-t dg-b" data-w="556">Management group (optional)</text>
<text x="36" y="142" font-size="12" class="dg-m" data-w="556">Apply one organization-wide policy initiative</text>
<text x="36" y="159" font-size="12" class="dg-m" data-w="556">to many subscriptions at once (recommended in production)</text>
<path d="M314 176 L314 204" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="329" y="180" width="74" height="20" rx="6" class="dg-chip"/>
<text x="366" y="194" font-size="11.5" text-anchor="middle" class="dg-t dg-b">inherited</text>
<rect x="24" y="204" width="580" height="76" rx="10" class="dg-box dg-warn"/>
<text x="36" y="228" font-size="14" class="dg-t dg-b" data-w="556">Subscription</text>
<text x="36" y="246" font-size="12" class="dg-m" data-w="556">Defender for Containers subscription plan</text>
<text x="36" y="263" font-size="12" class="dg-m" data-w="556">Budget and cost alerts</text>
<path d="M314 280 L314 308" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="329" y="284" width="74" height="20" rx="6" class="dg-chip"/>
<text x="366" y="298" font-size="11.5" text-anchor="middle" class="dg-t dg-b">inherited</text>
<rect x="24" y="308" width="580" height="93" rx="10" class="dg-box dg-azure"/>
<text x="36" y="332" font-size="14" class="dg-t dg-b" data-w="556">Resource group</text>
<text x="36" y="350" font-size="12" class="dg-m" data-w="556">Cluster RG: Pod security baseline/restricted and</text>
<text x="36" y="367" font-size="12" class="dg-m" data-w="556">6 cluster configuration policies (Audit by default)</text>
<text x="36" y="384" font-size="12" class="dg-m" data-w="556">network · platform RGs: deletion-protection locks (optional)</text>
<path d="M314 401 L314 429" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="329" y="405" width="74" height="20" rx="6" class="dg-chip"/>
<text x="366" y="419" font-size="11.5" text-anchor="middle" class="dg-t dg-b">inherited</text>
<rect x="24" y="429" width="580" height="76" rx="10" class="dg-box dg-ok"/>
<text x="36" y="453" font-size="14" class="dg-t dg-b" data-w="556">AKS cluster</text>
<text x="36" y="471" font-size="12" class="dg-m" data-w="556">The Azure Policy add-on (Gatekeeper) evaluates at admission</text>
<text x="36" y="488" font-size="12" class="dg-m" data-w="556">Audit only reports; Deny rejects the deployment</text>
<rect x="632" y="100" width="304" height="157" rx="10" class="dg-box dg-warn"/>
<text x="644" y="123.5" font-size="13.5" class="dg-t dg-b" data-w="280">Policy effects</text>
<text x="644" y="141" font-size="11.5" class="dg-m" data-w="280">Audit (default): report only</text>
<text x="644" y="157.5" font-size="11.5" class="dg-m" data-w="280">Deny: reject the deployment</text>
<text x="644" y="174" font-size="11.5" class="dg-m" data-w="280">Disabled: skip evaluation</text>
<text x="644" y="198.8" font-size="11.5" class="dg-m" data-w="280">Evaluation can take up to tens of</text>
<text x="644" y="215.3" font-size="11.5" class="dg-m" data-w="280">minutes right after assignment</text>
<text x="644" y="231.8" font-size="11.5" class="dg-m" data-w="280">Start with Audit to see the impact first</text>
<rect x="632" y="277" width="304" height="157" rx="10" class="dg-box dg-aws"/>
<text x="644" y="300.5" font-size="13.5" class="dg-t dg-b" data-w="280">AWS comparison</text>
<text x="644" y="318" font-size="11.5" class="dg-m" data-w="280">SCP: a permission ceiling for an account</text>
<text x="644" y="334.5" font-size="11.5" class="dg-m" data-w="280">Azure Policy: evaluates resource</text>
<text x="644" y="351" font-size="11.5" class="dg-m" data-w="280">properties to audit · deny · modify</text>
<text x="644" y="375.8" font-size="11.5" class="dg-m" data-w="280">AWS Config rules ≈ Policy Audit</text>
<text x="644" y="392.3" font-size="11.5" class="dg-m" data-w="280">Kyverno/OPA ≈ Policy add-on (Gatekeeper)</text>
<text x="644" y="408.8" font-size="11.5" class="dg-m" data-w="280">GuardDuty ≈ Defender for Containers</text>
</svg>
