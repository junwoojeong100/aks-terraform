.dg-grp{fill:none;stroke:var(--dg-border)}
.dg-dash{stroke-dasharray:6 4}
.dg-chip{fill:var(--dg-bg);stroke:none}
.dg-line{fill:none;stroke:var(--dg-line);stroke-width:1.8}
.dg-ah{fill:var(--dg-line)}
.dg-box.dg-aws{fill:var(--dg-aws-soft);stroke:var(--dg-aws)}
.dg-grp.dg-aws{stroke:var(--dg-aws)}
.dg-fill-aws{fill:var(--dg-aws)}
.dg-tx-aws{fill:var(--dg-aws)}
.dg-line.dg-aws{stroke:var(--dg-aws)}
.dg-ah.dg-aws{fill:var(--dg-aws)}
.dg-box.dg-azure{fill:var(--dg-azure-soft);stroke:var(--dg-azure)}
.dg-grp.dg-azure{stroke:var(--dg-azure)}
.dg-fill-azure{fill:var(--dg-azure)}
.dg-tx-azure{fill:var(--dg-azure)}
.dg-line.dg-azure{stroke:var(--dg-azure)}
.dg-ah.dg-azure{fill:var(--dg-azure)}
.dg-box.dg-ok{fill:var(--dg-ok-soft);stroke:var(--dg-ok)}
.dg-grp.dg-ok{stroke:var(--dg-ok)}
.dg-fill-ok{fill:var(--dg-ok)}
.dg-tx-ok{fill:var(--dg-ok)}
.dg-line.dg-ok{stroke:var(--dg-ok)}
.dg-ah.dg-ok{fill:var(--dg-ok)}
.dg-box.dg-id{fill:var(--dg-id-soft);stroke:var(--dg-id)}
.dg-grp.dg-id{stroke:var(--dg-id)}
.dg-fill-id{fill:var(--dg-id)}
.dg-tx-id{fill:var(--dg-id)}
.dg-line.dg-id{stroke:var(--dg-id)}
.dg-ah.dg-id{fill:var(--dg-id)}
.dg-box.dg-net{fill:var(--dg-net-soft);stroke:var(--dg-net)}
.dg-grp.dg-net{stroke:var(--dg-net)}
.dg-fill-net{fill:var(--dg-net)}
.dg-tx-net{fill:var(--dg-net)}
.dg-line.dg-net{stroke:var(--dg-net)}
.dg-ah.dg-net{fill:var(--dg-net)}
.dg-box.dg-warn{fill:var(--dg-warn-soft);stroke:var(--dg-warn)}
.dg-grp.dg-warn{stroke:var(--dg-warn)}
.dg-fill-warn{fill:var(--dg-warn)}
.dg-tx-warn{fill:var(--dg-warn)}
.dg-line.dg-warn{stroke:var(--dg-warn)}
.dg-ah.dg-warn{fill:var(--dg-warn)}
.dg-box.dg-danger{fill:var(--dg-danger-soft);stroke:var(--dg-danger)}
.dg-grp.dg-danger{stroke:var(--dg-danger)}
.dg-fill-danger{fill:var(--dg-danger)}
.dg-tx-danger{fill:var(--dg-danger)}
.dg-line.dg-danger{stroke:var(--dg-danger)}
.dg-ah.dg-danger{fill:var(--dg-danger)}
.dg-on{fill:#fff}</style><defs><marker id="governance-scopes-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="governance-scopes-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker><marker id="governance-scopes-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="governance-scopes-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="governance-scopes-ah-aws" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-aws"/></marker></defs><rect width="960" height="540" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">거버넌스는 어느 범위에 거는가</text>
<text x="24" y="54" font-size="12.5" class="dg-m">정책과 역할 할당은 상위 범위에서 하위로 상속됩니다. 이 실습은 리소스 그룹(클러스터 RG) 범위에 정책을 할당합니다.</text>
<rect x="24" y="100" width="580" height="76" rx="10" class="dg-box"/>
<text x="36" y="124" font-size="14" class="dg-t dg-b" data-w="556">관리 그룹 (선택)</text>
<text x="36" y="142" font-size="12" class="dg-m" data-w="556">조직 공통 정책 이니셔티브를</text>
<text x="36" y="159" font-size="12" class="dg-m" data-w="556">구독 여러 개에 한 번에 적용 (운영 권장)</text>
<path d="M314 176 L314 204" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="336.5" y="180" width="35" height="20" rx="6" class="dg-chip"/>
<text x="354" y="194" font-size="11.5" text-anchor="middle" class="dg-t dg-b">상속</text>
<rect x="24" y="204" width="580" height="76" rx="10" class="dg-box dg-warn"/>
<text x="36" y="228" font-size="14" class="dg-t dg-b" data-w="556">구독</text>
<text x="36" y="246" font-size="12" class="dg-m" data-w="556">Defender for Containers 구독 플랜</text>
<text x="36" y="263" font-size="12" class="dg-m" data-w="556">예산(Budget)과 비용 알림</text>
<path d="M314 280 L314 308" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="336.5" y="284" width="35" height="20" rx="6" class="dg-chip"/>
<text x="354" y="298" font-size="11.5" text-anchor="middle" class="dg-t dg-b">상속</text>
<rect x="24" y="308" width="580" height="93" rx="10" class="dg-box dg-azure"/>
<text x="36" y="332" font-size="14" class="dg-t dg-b" data-w="556">리소스 그룹</text>
<text x="36" y="350" font-size="12" class="dg-m" data-w="556">클러스터 RG: Pod 보안 baseline/restricted 와</text>
<text x="36" y="367" font-size="12" class="dg-m" data-w="556">클러스터 설정 정책 6개 (기본 Audit)</text>
<text x="36" y="384" font-size="12" class="dg-m" data-w="556">network · platform RG: 삭제 방지 잠금(옵션)</text>
<path d="M314 401 L314 429" class="dg-line" marker-end="url(#governance-scopes-ah-line)"/>
<rect x="336.5" y="405" width="35" height="20" rx="6" class="dg-chip"/>
<text x="354" y="419" font-size="11.5" text-anchor="middle" class="dg-t dg-b">상속</text>
<rect x="24" y="429" width="580" height="76" rx="10" class="dg-box dg-ok"/>
<text x="36" y="453" font-size="14" class="dg-t dg-b" data-w="556">AKS 클러스터</text>
<text x="36" y="471" font-size="12" class="dg-m" data-w="556">Azure Policy 애드온(Gatekeeper)이 Admission 에서 평가</text>
<text x="36" y="488" font-size="12" class="dg-m" data-w="556">Audit 는 보고만, Deny 는 배포를 거부</text>
<rect x="632" y="100" width="304" height="141" rx="10" class="dg-box dg-warn"/>
<text x="644" y="123.5" font-size="13.5" class="dg-t dg-b" data-w="280">정책 효과(effect)</text>
<text x="644" y="141" font-size="11.5" class="dg-m" data-w="280">Audit (기본)  비준수를 보고만 함</text>
<text x="644" y="157.5" font-size="11.5" class="dg-m" data-w="280">Deny           배포를 거부</text>
<text x="644" y="174" font-size="11.5" class="dg-m" data-w="280">Disabled       평가하지 않음</text>
<text x="644" y="198.8" font-size="11.5" class="dg-m" data-w="280">평가는 할당 직후 최대 수십 분</text>
<text x="644" y="215.3" font-size="11.5" class="dg-m" data-w="280">처음에는 Audit 으로 영향부터 확인</text>
<rect x="632" y="261" width="304" height="157" rx="10" class="dg-box dg-aws"/>
<text x="644" y="284.5" font-size="13.5" class="dg-t dg-b" data-w="280">AWS 와 비교</text>
<text x="644" y="302" font-size="11.5" class="dg-m" data-w="280">SCP: 계정이 쓸 수 있는 권한의 상한선</text>
<text x="644" y="318.5" font-size="11.5" class="dg-m" data-w="280">Azure Policy: 리소스의 속성을 평가해</text>
<text x="644" y="335" font-size="11.5" class="dg-m" data-w="280">감사 · 거부 · 자동 수정</text>
<text x="644" y="359.8" font-size="11.5" class="dg-m" data-w="280">AWS Config 규칙 ≈ Policy Audit</text>
<text x="644" y="376.3" font-size="11.5" class="dg-m" data-w="280">Kyverno/OPA ≈ Policy 애드온(Gatekeeper)</text>
<text x="644" y="392.8" font-size="11.5" class="dg-m" data-w="280">GuardDuty ≈ Defender for Containers</text>
</svg>
