.dg-on{fill:#fff}</style><defs><marker id="network-topology-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="network-topology-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="network-topology-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="network-topology-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="network-topology-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker></defs><rect width="960" height="550" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">VNet design: subnets · NSGs · NAT Gateway · Private DNS</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Subnets span the whole region (not tied to an AZ) and are split by role. Every later stack looks up this VNet as a data source.</text>
<rect x="24" y="92" width="640" height="438" rx="14" class="dg-grp dg-net"/>
<text x="38" y="112" font-size="12.5" class="dg-tx-net dg-b" data-w="612">VNet vnet-aksdemo-dev-krc · 10.10.0.0/16 · spans the whole koreacentral region</text>
<rect x="44" y="124" width="290" height="134" rx="10" class="dg-box dg-net"/>
<text x="56" y="148" font-size="14" class="dg-t dg-b" data-w="266">snet-aks-apiserver</text>
<text x="56" y="166" font-size="11.5" class="dg-m" data-w="266">10.10.1.0/28 (dedicated to AKS, min /28)</text>
<text x="56" y="182.5" font-size="11.5" class="dg-m" data-w="266">Hosts the projected API server endpoint</text>
<text x="56" y="199" font-size="11.5" class="dg-m" data-w="266">Delegation: managedClusters</text>
<text x="56" y="215.5" font-size="11.5" class="dg-m" data-w="266">No NSG attached (delegated subnet)</text>
<rect x="354" y="124" width="290" height="134" rx="10" class="dg-box dg-azure"/>
<text x="366" y="148" font-size="14" class="dg-t dg-b" data-w="266">snet-aks-nodes</text>
<text x="366" y="166" font-size="11.5" class="dg-m" data-w="266">10.10.0.0/24 · node IPs only</text>
<text x="366" y="182.5" font-size="11.5" class="dg-m" data-w="266">Pods use the overlay (10.244.0.0/16)</text>
<text x="366" y="199" font-size="11.5" class="dg-m" data-w="266">NSG: allows inbound from pods,</text>
<text x="366" y="215.5" font-size="11.5" class="dg-m" data-w="266">the API server and the Gateway</text>
<text x="366" y="232" font-size="11.5" class="dg-m" data-w="266">NAT Gateway attached, no default outbound</text>
<rect x="44" y="270" width="290" height="124" rx="10" class="dg-box dg-net"/>
<text x="56" y="294" font-size="14" class="dg-t dg-b" data-w="266">snet-ingress</text>
<text x="56" y="312" font-size="11.5" class="dg-m" data-w="266">10.10.2.0/27</text>
<text x="56" y="328.5" font-size="11.5" class="dg-m" data-w="266">Internal load balancer frontend IP</text>
<text x="56" y="345" font-size="11.5" class="dg-m" data-w="266">(when internal_gateway = true)</text>
<text x="56" y="361.5" font-size="11.5" class="dg-m" data-w="266">NSG attached (traffic is evaluated</text>
<text x="56" y="378" font-size="11.5" class="dg-m" data-w="266">by the node NSG)</text>
<rect x="354" y="270" width="290" height="124" rx="10" class="dg-box dg-net"/>
<text x="366" y="294" font-size="14" class="dg-t dg-b" data-w="266">snet-private-endpoints</text>
<text x="366" y="312" font-size="11.5" class="dg-m" data-w="266">10.10.3.0/27</text>
<text x="366" y="328.5" font-size="11.5" class="dg-m" data-w="266">Private endpoints for ACR · Key Vault</text>
<text x="366" y="345" font-size="11.5" class="dg-m" data-w="266">NSG: allows only 443 from the node subnet,</text>
<text x="366" y="361.5" font-size="11.5" class="dg-m" data-w="266">denies other inbound within the VNet</text>
<rect x="44" y="408" width="600" height="108" rx="10" class="dg-box dg-dash"/>
<text x="56" y="432" font-size="14" class="dg-t dg-b" data-w="576">Good to know</text>
<text x="56" y="450" font-size="12" class="dg-m" data-w="576">Subnets span all AZs (unlike AWS); zones belong to node pools and load balancers.</text>
<text x="56" y="467" font-size="12" class="dg-m" data-w="576">A NAT Gateway attaches directly to the subnet; no route table changes are needed.</text>
<text x="56" y="484" font-size="12" class="dg-m" data-w="576">Choose a VNet address space that does not overlap with on-premises or peered networks.</text>
<rect x="690" y="124" width="246" height="84" rx="10" class="dg-box dg-net"/>
<text x="702" y="147" font-size="13" class="dg-t dg-b" data-w="222">NAT Gateway (StandardV2)</text>
<text x="702" y="164" font-size="11.5" class="dg-m" data-w="222">Zone-redundant · static public IP</text>
<text x="702" y="180.5" font-size="11.5" class="dg-m" data-w="222">Directly attached to node subnet</text>
<rect x="690" y="224" width="246" height="44" rx="10" class="dg-box"/>
<text x="813" y="247" font-size="13" text-anchor="middle" class="dg-t dg-b" data-w="222">Internet (static egress IP)</text>
<rect x="690" y="284" width="246" height="96" rx="10" class="dg-box dg-ok"/>
<text x="702" y="307" font-size="13" class="dg-t dg-b" data-w="222">ACR · Key Vault (PaaS)</text>
<text x="702" y="324" font-size="11.5" class="dg-m" data-w="222">Public access: admin IPs only</text>
<text x="702" y="340.5" font-size="11.5" class="dg-m" data-w="222">(default Deny)</text>
<text x="702" y="357" font-size="11.5" class="dg-m" data-w="222">Nodes/pods use private endpoints</text>
<rect x="690" y="392" width="246" height="104" rx="10" class="dg-box dg-id"/>
<text x="702" y="415" font-size="13" class="dg-t dg-b" data-w="222">Private DNS zones ×2</text>
<text x="702" y="432" font-size="11.5" class="dg-m" data-w="222">privatelink.azurecr.io</text>
<text x="702" y="448.5" font-size="11.5" class="dg-m" data-w="222">privatelink.vaultcore.azure.net</text>
<text x="702" y="465" font-size="11.5" class="dg-m" data-w="222">VNet link resolves to private IPs</text>
<path d="M644 191 L667 191 L667 166 L690 166" class="dg-line dg-net" marker-end="url(#network-topology-ah-net)"/>
<path d="M813 208 L813 224" class="dg-line dg-net" marker-end="url(#network-topology-ah-net)"/>
<path d="M644 332 L690 332" class="dg-line dg-ok" marker-end="url(#network-topology-ah-ok)"/>
<path d="M690 444 L664 444" class="dg-line dg-id" marker-end="url(#network-topology-ah-id)"/>
</svg>
