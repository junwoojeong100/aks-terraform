.dg-on{fill:#fff}</style><defs><marker id="network-topology-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="network-topology-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="network-topology-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="network-topology-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="network-topology-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker></defs><rect width="960" height="550" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">VNet 설계: 서브넷 · NSG · NAT Gateway · Private DNS</text>
<text x="24" y="54" font-size="12.5" class="dg-m">서브넷은 리전 전체에 걸치며(AZ 에 묶이지 않음) 역할별로 나눕니다. 이후 모든 스택이 이 VNet 을 data source 로 조회합니다.</text>
<rect x="24" y="92" width="640" height="438" rx="14" class="dg-grp dg-net"/>
<text x="38" y="112" font-size="12.5" class="dg-tx-net dg-b" data-w="612">VNet vnet-aksdemo-dev-krc · 10.10.0.0/16 · koreacentral 리전 전체</text>
<rect x="44" y="124" width="290" height="134" rx="10" class="dg-box dg-net"/>
<text x="56" y="148" font-size="14" class="dg-t dg-b" data-w="266">snet-aks-apiserver</text>
<text x="56" y="166" font-size="11.5" class="dg-m" data-w="266">10.10.1.0/28 (AKS 전용, 최소 /28)</text>
<text x="56" y="182.5" font-size="11.5" class="dg-m" data-w="266">API 서버 엔드포인트가 이 서브넷에 투영</text>
<text x="56" y="199" font-size="11.5" class="dg-m" data-w="266">위임(delegation): managedClusters</text>
<text x="56" y="215.5" font-size="11.5" class="dg-m" data-w="266">NSG 없음 (AKS 가 관리)</text>
<rect x="354" y="124" width="290" height="134" rx="10" class="dg-box dg-azure"/>
<text x="366" y="148" font-size="14" class="dg-t dg-b" data-w="266">snet-aks-nodes</text>
<text x="366" y="166" font-size="11.5" class="dg-m" data-w="266">10.10.0.0/24 · 노드 IP 전용</text>
<text x="366" y="182.5" font-size="11.5" class="dg-m" data-w="266">Pod 는 오버레이(10.244.0.0/16)라 IP 미사용</text>
<text x="366" y="199" font-size="11.5" class="dg-m" data-w="266">NSG + NAT Gateway 연결</text>
<text x="366" y="215.5" font-size="11.5" class="dg-m" data-w="266">기본 아웃바운드 접근 비활성화</text>
<rect x="44" y="270" width="290" height="124" rx="10" class="dg-box dg-net"/>
<text x="56" y="294" font-size="14" class="dg-t dg-b" data-w="266">snet-ingress</text>
<text x="56" y="312" font-size="11.5" class="dg-m" data-w="266">10.10.2.0/27</text>
<text x="56" y="328.5" font-size="11.5" class="dg-m" data-w="266">내부 로드밸런서 프런트엔드 IP</text>
<text x="56" y="345" font-size="11.5" class="dg-m" data-w="266">(internal_gateway = true 일 때)</text>
<text x="56" y="361.5" font-size="11.5" class="dg-m" data-w="266">NSG 연결</text>
<rect x="354" y="270" width="290" height="124" rx="10" class="dg-box dg-net"/>
<text x="366" y="294" font-size="14" class="dg-t dg-b" data-w="266">snet-private-endpoints</text>
<text x="366" y="312" font-size="11.5" class="dg-m" data-w="266">10.10.3.0/27</text>
<text x="366" y="328.5" font-size="11.5" class="dg-m" data-w="266">ACR · Key Vault 의 Private Endpoint</text>
<text x="366" y="345" font-size="11.5" class="dg-m" data-w="266">NSG: 노드 서브넷의 443 만 허용,</text>
<text x="366" y="361.5" font-size="11.5" class="dg-m" data-w="266">나머지 VNet 내부 인바운드는 거부</text>
<rect x="44" y="408" width="600" height="108" rx="10" class="dg-box dg-dash"/>
<text x="56" y="432" font-size="14" class="dg-t dg-b" data-w="576">알아 둘 점</text>
<text x="56" y="450" font-size="12" class="dg-m" data-w="576">서브넷은 가용 영역(AZ)에 묶이지 않습니다. 영역은 노드 풀·로드밸런서의 속성입니다 (AWS 와 다름).</text>
<text x="56" y="467" font-size="12" class="dg-m" data-w="576">NAT Gateway 는 서브넷에 직접 연결합니다. 라우트 테이블 수정이 필요 없습니다.</text>
<text x="56" y="484" font-size="12" class="dg-m" data-w="576">VNet 주소 공간은 온프레미스·피어링 대상과 겹치지 않게 정하세요.</text>
<rect x="690" y="132" width="246" height="84" rx="10" class="dg-box dg-net"/>
<text x="702" y="155" font-size="13" class="dg-t dg-b" data-w="222">NAT Gateway (StandardV2)</text>
<text x="702" y="172" font-size="11.5" class="dg-m" data-w="222">영역 중복 · 고정 공용 IP</text>
<text x="702" y="188.5" font-size="11.5" class="dg-m" data-w="222">노드 서브넷에 직접 연결</text>
<rect x="690" y="232" width="246" height="44" rx="10" class="dg-box"/>
<text x="813" y="255" font-size="13" text-anchor="middle" class="dg-t dg-b" data-w="222">인터넷 (고정 egress IP)</text>
<rect x="690" y="292" width="246" height="80" rx="10" class="dg-box dg-ok"/>
<text x="702" y="315" font-size="13" class="dg-t dg-b" data-w="222">ACR · Key Vault (PaaS)</text>
<text x="702" y="332" font-size="11.5" class="dg-m" data-w="222">공용 접근은 관리자 IP 만(기본 Deny)</text>
<text x="702" y="348.5" font-size="11.5" class="dg-m" data-w="222">노드·파드는 Private Endpoint 로</text>
<rect x="690" y="392" width="246" height="104" rx="10" class="dg-box dg-id"/>
<text x="702" y="415" font-size="13" class="dg-t dg-b" data-w="222">Private DNS Zone ×2</text>
<text x="702" y="432" font-size="11.5" class="dg-m" data-w="222">privatelink.azurecr.io</text>
<text x="702" y="448.5" font-size="11.5" class="dg-m" data-w="222">privatelink.vaultcore.azure.net</text>
<text x="702" y="465" font-size="11.5" class="dg-m" data-w="222">VNet 링크로 사설 IP 로 해석</text>
<path d="M644 191 L667 191 L667 174 L690 174" class="dg-line dg-net" marker-end="url(#network-topology-ah-net)"/>
<path d="M813 216 L813 232" class="dg-line dg-net" marker-end="url(#network-topology-ah-net)"/>
<path d="M644 332 L690 332" class="dg-line dg-ok" marker-end="url(#network-topology-ah-ok)"/>
<path d="M690 444 L664 444" class="dg-line dg-id" marker-end="url(#network-topology-ah-id)"/>
</svg>
