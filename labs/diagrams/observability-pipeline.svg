.dg-on{fill:#fff}</style><defs><marker id="observability-pipeline-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="observability-pipeline-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="observability-pipeline-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker><marker id="observability-pipeline-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="observability-pipeline-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker></defs><rect width="960" height="520" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">Observability pipeline: logs · metrics · control plane logs</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Everything is unified in Azure Monitor. A DCR (Data Collection Rule) and a DCRA (association) declare what to collect (Lab 05).</text>
<text x="24" y="96" font-size="12.5" class="dg-m dg-b">Sources (AKS)</text>
<text x="344" y="96" font-size="12.5" class="dg-m dg-b">Collection (declared in Terraform)</text>
<text x="676" y="96" font-size="12.5" class="dg-m dg-b">Storage · visualization</text>
<rect x="24" y="108" width="280" height="96" rx="10" class="dg-box"/>
<text x="36" y="131.5" font-size="13.5" class="dg-t dg-b" data-w="256">Container logs</text>
<text x="36" y="149" font-size="11.5" class="dg-m" data-w="256">ama-logs (DaemonSet)</text>
<text x="36" y="165.5" font-size="11.5" class="dg-m" data-w="256">≈ CloudWatch Container Insights</text>
<rect x="344" y="108" width="290" height="96" rx="10" class="dg-box dg-net"/>
<text x="356" y="131" font-size="13" class="dg-t dg-b" data-w="266">DCR container-insights</text>
<text x="356" y="148" font-size="11.5" class="dg-m" data-w="266">ContainerLogV2 · KubeEvents</text>
<text x="356" y="164.5" font-size="11.5" class="dg-m" data-w="266">Pod/Node/Service inventory</text>
<path d="M304 156 L344 156" class="dg-line dg-net" marker-end="url(#observability-pipeline-ah-net)"/>
<rect x="24" y="220" width="280" height="96" rx="10" class="dg-box"/>
<text x="36" y="243.5" font-size="13.5" class="dg-t dg-b" data-w="256">Control plane logs</text>
<text x="36" y="261" font-size="11.5" class="dg-m" data-w="256">kube-audit-admin · kube-apiserver</text>
<text x="36" y="277.5" font-size="11.5" class="dg-m" data-w="256">scheduler · autoscaler · guard</text>
<rect x="344" y="220" width="290" height="96" rx="10" class="dg-box dg-id"/>
<text x="356" y="243" font-size="13" class="dg-t dg-b" data-w="266">Diagnostic setting</text>
<text x="356" y="260" font-size="11.5" class="dg-m" data-w="266">≈ EKS control plane logging</text>
<text x="356" y="276.5" font-size="11.5" class="dg-m" data-w="266">Dedicated tables (AKSAudit, etc.)</text>
<path d="M304 268 L344 268" class="dg-line dg-id" marker-end="url(#observability-pipeline-ah-id)"/>
<rect x="24" y="332" width="280" height="96" rx="10" class="dg-box"/>
<text x="36" y="355.5" font-size="13.5" class="dg-t dg-b" data-w="256">Metrics</text>
<text x="36" y="373" font-size="11.5" class="dg-m" data-w="256">ama-metrics (Prometheus scraping)</text>
<text x="36" y="389.5" font-size="11.5" class="dg-m" data-w="256">≈ remote write to AMP</text>
<rect x="344" y="332" width="290" height="96" rx="10" class="dg-box dg-azure"/>
<text x="356" y="355" font-size="13" class="dg-t dg-b" data-w="266">DCE + DCR prometheus</text>
<text x="356" y="372" font-size="11.5" class="dg-m" data-w="266">Microsoft-PrometheusMetrics</text>
<text x="356" y="388.5" font-size="11.5" class="dg-m" data-w="266">Linked to the cluster via DCRA</text>
<path d="M304 380 L344 380" class="dg-line dg-azure" marker-end="url(#observability-pipeline-ah-azure)"/>
<rect x="676" y="108" width="260" height="208" rx="10" class="dg-box dg-ok"/>
<text x="688" y="131.5" font-size="13.5" class="dg-t dg-b" data-w="236">Log Analytics workspace</text>
<text x="688" y="149" font-size="11.5" class="dg-m" data-w="236">Container logs (ContainerLogV2 …)</text>
<text x="688" y="165.5" font-size="11.5" class="dg-m" data-w="236">Control plane logs (AKSAudit …)</text>
<text x="688" y="190.3" font-size="11.5" class="dg-m" data-w="236">Query with KQL · a daily ingestion</text>
<text x="688" y="206.8" font-size="11.5" class="dg-m" data-w="236">cap prevents runaway costs</text>
<text x="688" y="231.5" font-size="11.5" class="dg-m" data-w="236">≈ CloudWatch Logs + Logs Insights</text>
<rect x="676" y="340" width="260" height="80" rx="10" class="dg-box dg-ok"/>
<text x="688" y="363" font-size="13" class="dg-t dg-b" data-w="236">Azure Monitor workspace</text>
<text x="688" y="380" font-size="11.5" class="dg-m" data-w="236">Managed Prometheus</text>
<text x="688" y="396.5" font-size="11.5" class="dg-m" data-w="236">+ recording rules (for dashboards)</text>
<rect x="676" y="448" width="260" height="58" rx="10" class="dg-box dg-ok"/>
<text x="688" y="471.5" font-size="13.5" class="dg-t dg-b" data-w="236">Managed Grafana</text>
<text x="688" y="489" font-size="11" class="dg-m" data-w="236">Prometheus data source auto-connected</text>
<path d="M634 156 L676 156" class="dg-line dg-net" marker-end="url(#observability-pipeline-ah-net)"/>
<path d="M634 268 L676 268" class="dg-line dg-id" marker-end="url(#observability-pipeline-ah-id)"/>
<path d="M634 380 L676 380" class="dg-line dg-azure" marker-end="url(#observability-pipeline-ah-azure)"/>
<path d="M806 420 L806 448" class="dg-line dg-ok" marker-end="url(#observability-pipeline-ah-ok)"/>
<rect x="817.5" y="424" width="57" height="20" rx="6" class="dg-chip"/>
<text x="846" y="438" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">PromQL</text>
<text x="24" y="466" font-size="11.5" class="dg-m" data-w="640">Grafana reads Prometheus with the &quot;Monitoring Data Reader&quot; role,</text>
<text x="24" y="484" font-size="11.5" class="dg-m" data-w="640">and operators sign in with the &quot;Grafana Admin&quot; role (role assignments in Lab 04).</text>
</svg>
