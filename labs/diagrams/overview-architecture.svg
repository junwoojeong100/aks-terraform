<text x="554" y="367" font-size="13" class="dg-t dg-b" data-w="114">User node</text>
<text x="554" y="384" font-size="11.5" class="dg-m" data-w="114">D4ds_v5</text>
<text x="214" y="426" font-size="11" class="dg-m" data-w="476">Entry: public Azure LB → Gateway (Envoy) pods · Pod CIDR 10.244.0.0/16</text>
<rect x="200" y="462" width="240" height="70" rx="10" class="dg-box dg-net"/>
<text x="210" y="482.5" font-size="12.5" class="dg-t dg-b" data-w="220">NAT Gateway (StandardV2)</text>
<text x="210" y="499" font-size="11" class="dg-m" data-w="220">Static public IP · zone-redundant</text>
<text x="210" y="515" font-size="11" class="dg-m" data-w="220">Egress path for the node subnet</text>
<rect x="460" y="462" width="240" height="70" rx="10" class="dg-box dg-net"/>
<text x="470" y="482.5" font-size="12.5" class="dg-t dg-b" data-w="220">snet-private-endpoints</text>
<text x="470" y="499" font-size="11" class="dg-m" data-w="220">10.10.3.0/27</text>
<text x="470" y="515" font-size="11" class="dg-m" data-w="220">Private path to ACR · Key Vault</text>
<rect x="200" y="544" width="240" height="64" rx="10" class="dg-box dg-net"/>
