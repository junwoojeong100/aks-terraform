<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="overview-architecture-t overview-architecture-d"><title id="overview-architecture-t">Overall architecture built in this guide</title><desc id="overview-architecture-d">Internet users reach apps on an AKS node pool that spans three availability zones through a public load balancer and a Gateway (Envoy). Nodes send outbound traffic through a NAT Gateway, and ACR and Key Vault are reached over Private Endpoints.</desc><style>svg.dg{--dg-bg:#ffffff;--dg-fg:#1f2328;--dg-muted:#59636e;--dg-line:#6e7781;--dg-card:#f6f8fa;--dg-border:#d1d9e0;--dg-aws:#c2590a;--dg-aws-soft:#fff1e5;--dg-azure:#0b6ed0;--dg-azure-soft:#e5f1ff;--dg-ok:#1a7f37;--dg-ok-soft:#e6f6ea;--dg-id:#8250df;--dg-id-soft:#f3ecff;--dg-net:#0e7490;--dg-net-soft:#e0f4f8;--dg-warn:#9a6700;--dg-warn-soft:#fff6d6;--dg-danger:#cf222e;--dg-danger-soft:#ffebe9;font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif}
