<text x="24" y="32" font-size="18" class="dg-t dg-b">Overall architecture built in this guide</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Read it alongside the EKS setup (VPC · EKS · ECR · IAM). Colored boxes are Azure services; dashed lines are logical boundaries.</text>
<rect x="24" y="250" width="130" height="60" rx="10" class="dg-box"/>
<text x="89" y="272" font-size="14" text-anchor="middle" class="dg-t dg-b" data-w="110">Users</text>
<text x="89" y="290" font-size="12.5" text-anchor="middle" class="dg-m" data-w="110">Internet</text>
<rect x="24" y="467" width="130" height="60" rx="10" class="dg-box"/>
<text x="89" y="487" font-size="14" text-anchor="middle" class="dg-t dg-b" data-w="114">External</text>
<text x="89" y="505" font-size="12.5" text-anchor="middle" class="dg-m" data-w="114">egress targets</text>
<rect x="24" y="546" width="130" height="60" rx="10" class="dg-box"/>
<text x="89" y="566" font-size="14" text-anchor="middle" class="dg-t dg-b" data-w="114">Operator</text>
<text x="89" y="584" font-size="10.5" text-anchor="middle" class="dg-m" data-w="114">kubectl · terraform</text>
<rect x="170" y="96" width="766" height="532" rx="14" class="dg-grp dg-azure"/>
<text x="184" y="116" font-size="12.5" class="dg-tx-azure dg-b" data-w="738">Azure subscription · koreacentral</text>
<rect x="186" y="128" width="276" height="58" rx="10" class="dg-box dg-id"/>
<text x="198" y="152" font-size="14" class="dg-t dg-b" data-w="252">Microsoft Entra ID</text>
<text x="198" y="170" font-size="11" class="dg-m" data-w="252">Sign-in · Azure RBAC · Workload Identity</text>
<rect x="474" y="128" width="240" height="58" rx="10" class="dg-box dg-warn"/>
<text x="486" y="152" font-size="14" class="dg-t dg-b" data-w="216">Governance (Lab 08)</text>
<text x="486" y="170" font-size="11" class="dg-m" data-w="216">Policy · Defender · locks · budgets</text>
<rect x="186" y="200" width="528" height="416" rx="14" class="dg-grp dg-net"/>
<text x="200" y="220" font-size="12.5" class="dg-tx-net dg-b" data-w="500">VNet 10.10.0.0/16 · subnets are not tied to a zone · protected by NSGs</text>
<rect x="200" y="230" width="500" height="216" rx="14" class="dg-grp dg-net dg-dash"/>
<text x="214" y="250" font-size="12" class="dg-tx-net dg-b" data-w="472">snet-aks-nodes 10.10.0.0/24</text>
<rect x="212" y="262" width="150" height="148" rx="14" class="dg-grp"/>
<text x="226" y="282" font-size="12" class="dg-m dg-b" data-w="122">Zone 1</text>
