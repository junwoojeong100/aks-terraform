<text x="740" y="220" font-size="12.5" class="dg-tx-ok dg-b" data-w="168">Shared services</text>
<rect x="736" y="232" width="176" height="56" rx="10" class="dg-box dg-ok"/>
<text x="746" y="253" font-size="13" class="dg-t dg-b" data-w="156">ACR (Premium)</text>
<text x="746" y="270" font-size="11.5" class="dg-m" data-w="156">Image registry ≈ ECR</text>
<rect x="736" y="296" width="176" height="56" rx="10" class="dg-box dg-ok"/>
<text x="746" y="317" font-size="13" class="dg-t dg-b" data-w="156">Key Vault</text>
<text x="746" y="334" font-size="11.5" class="dg-m" data-w="156">≈ Secrets Manager</text>
<rect x="736" y="360" width="176" height="56" rx="10" class="dg-box dg-ok"/>
<text x="746" y="381" font-size="13" class="dg-t dg-b" data-w="156">Log Analytics</text>
<text x="746" y="398" font-size="11.5" class="dg-m" data-w="156">Logs ≈ CloudWatch Logs</text>
<rect x="736" y="424" width="176" height="56" rx="10" class="dg-box dg-ok"/>
<text x="746" y="445" font-size="13" class="dg-t dg-b" data-w="156">Monitor workspace</text>
<text x="746" y="462" font-size="11.5" class="dg-m" data-w="156">Prometheus metric store</text>
<rect x="736" y="488" width="176" height="56" rx="10" class="dg-box dg-ok"/>
<text x="746" y="509" font-size="13" class="dg-t dg-b" data-w="156">Managed Grafana</text>
<text x="746" y="526" font-size="11.5" class="dg-m" data-w="156">Dashboards ≈ AMG</text>
