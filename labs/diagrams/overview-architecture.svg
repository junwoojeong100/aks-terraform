<text x="230" y="309" font-size="13" class="dg-t dg-b" data-w="114">System node</text>
<text x="230" y="326" font-size="11.5" class="dg-m" data-w="114">D4ds_v5</text>
<rect x="222" y="348" width="130" height="50" rx="10" class="dg-box dg-azure"/>
<text x="230" y="367" font-size="13" class="dg-t dg-b" data-w="114">User node</text>
<text x="230" y="384" font-size="11.5" class="dg-m" data-w="114">D4ds_v5</text>
<rect x="374" y="262" width="150" height="148" rx="14" class="dg-grp"/>
<text x="388" y="282" font-size="12" class="dg-m dg-b" data-w="122">Zone 2</text>
<rect x="384" y="290" width="130" height="50" rx="10" class="dg-box dg-azure"/>
<text x="392" y="309" font-size="13" class="dg-t dg-b" data-w="114">System node</text>
<text x="392" y="326" font-size="11.5" class="dg-m" data-w="114">D4ds_v5</text>
<rect x="384" y="348" width="130" height="50" rx="10" class="dg-box dg-azure"/>
<text x="392" y="367" font-size="13" class="dg-t dg-b" data-w="114">User node</text>
<text x="392" y="384" font-size="11.5" class="dg-m" data-w="114">D4ds_v5</text>
<rect x="536" y="262" width="150" height="148" rx="14" class="dg-grp"/>
<text x="550" y="282" font-size="12" class="dg-m dg-b" data-w="122">Zone 3</text>
