.dg-ah.dg-danger{fill:var(--dg-danger)}
.dg-on{fill:#fff}</style><defs><marker id="private-api-access-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="private-api-access-ah-net" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-net"/></marker><marker id="private-api-access-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="private-api-access-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="private-api-access-ah-id" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-id"/></marker><marker id="private-api-access-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-warn"/></marker></defs><rect width="960" height="632" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">Two ways to reach a private API server</text>
<text x="24" y="54" font-size="12.5" class="dg-m">The API server has only a private IP (enable_private_cluster = true). The methods differ in how the client reaches it.</text>
<rect x="24" y="88" width="912" height="200" rx="14" class="dg-grp dg-net"/>
<text x="38" y="108" font-size="12.5" class="dg-tx-net dg-b" data-w="884">① Direct private IP · same VNet, peering, VPN / ExpressRoute</text>
<rect x="40" y="118" width="236" height="48" rx="10" class="dg-box"/>
<text x="50" y="138.5" font-size="12.5" class="dg-t dg-b" data-w="216">Jump host VM + Bastion</text>
<text x="50" y="155" font-size="11" class="dg-m" data-w="216">in the AKS VNet, no public IP</text>
<rect x="40" y="172" width="236" height="48" rx="10" class="dg-box"/>
<text x="50" y="192.5" font-size="12.5" class="dg-t dg-b" data-w="216">Self-hosted runner · VM</text>
<text x="50" y="209" font-size="11" class="dg-m" data-w="216">in a peered VNet (hub / ops)</text>
<rect x="40" y="226" width="236" height="48" rx="10" class="dg-box"/>
<text x="50" y="246.5" font-size="12.5" class="dg-t dg-b" data-w="216">Laptop · on-premises</text>
<text x="50" y="263" font-size="11" class="dg-m" data-w="216">over VPN or ExpressRoute</text>
<rect x="330" y="118" width="268" height="156" rx="10" class="dg-box dg-net"/>
<text x="342" y="141" font-size="13" class="dg-t dg-b" data-w="244">Network path to the private IP</text>
<text x="342" y="158" font-size="11.5" class="dg-m" data-w="244">Same VNet · VNet peering</text>
<text x="342" y="174.5" font-size="11.5" class="dg-m" data-w="244">VPN gateway · ExpressRoute</text>
<text x="342" y="191" font-size="11.5" class="dg-m" data-w="244">Address spaces must not overlap</text>
<text x="342" y="207.5" font-size="11.5" class="dg-m" data-w="244">Peering is not transitive</text>
<text x="342" y="224" font-size="11.5" class="dg-m" data-w="244">NSG / firewall: allow TCP 443</text>
<rect x="660" y="118" width="260" height="156" rx="10" class="dg-box dg-ok"/>
<text x="672" y="141" font-size="13" class="dg-t dg-b" data-w="236">snet-aks-apiserver</text>
<text x="672" y="158" font-size="11.5" class="dg-m" data-w="236">10.10.1.0/28 (delegated)</text>
<text x="672" y="174.5" font-size="11.5" class="dg-m" data-w="236">Internal load balancer (ILB)</text>
<text x="672" y="191" font-size="11.5" class="dg-m" data-w="236">private IP · port 443</text>
<text x="672" y="207.5" font-size="11.5" class="dg-m" data-w="236">No public endpoint</text>
<text x="672" y="224" font-size="11.5" class="dg-m" data-w="236">Authorized IP ranges do not apply</text>
<path d="M276 142 L330 142" class="dg-line dg-net" marker-end="url(#private-api-access-ah-net)"/>
<path d="M276 196 L330 196" class="dg-line dg-net" marker-end="url(#private-api-access-ah-net)"/>
<path d="M276 250 L330 250" class="dg-line dg-net" marker-end="url(#private-api-access-ah-net)"/>
<path d="M598 196 L660 196" class="dg-line dg-ok" marker-end="url(#private-api-access-ah-ok)"/>
<rect x="24" y="304" width="912" height="204" rx="14" class="dg-grp dg-azure"/>
<text x="38" y="324" font-size="12.5" class="dg-tx-azure dg-b" data-w="884">② Private Link · Private Endpoint → Private Link Service</text>
<rect x="40" y="336" width="400" height="160" rx="14" class="dg-grp"/>
<text x="54" y="356" font-size="12" class="dg-m dg-b" data-w="372">Client VNet (any subscription or tenant)</text>
<rect x="52" y="366" width="170" height="118" rx="10" class="dg-box"/>
<text x="62" y="386.5" font-size="12.5" class="dg-t dg-b" data-w="150">Client VM · runner</text>
<text x="62" y="403" font-size="11" class="dg-m" data-w="150">Any address space,</text>
<text x="62" y="419" font-size="11" class="dg-m" data-w="150">overlap is fine</text>
<text x="62" y="435" font-size="11" class="dg-m" data-w="150">No peering needed</text>
<rect x="258" y="366" width="170" height="118" rx="10" class="dg-box dg-net"/>
<text x="268" y="386.5" font-size="12.5" class="dg-t dg-b" data-w="150">Private Endpoint</text>
<text x="268" y="403" font-size="11" class="dg-m" data-w="150">Private IP in the client</text>
<text x="268" y="419" font-size="11" class="dg-m" data-w="150">subnet; an A record in</text>
<text x="268" y="435" font-size="11" class="dg-m" data-w="150">your DNS zone points</text>
<text x="268" y="451" font-size="11" class="dg-m" data-w="150">to it</text>
<rect x="520" y="336" width="404" height="160" rx="14" class="dg-grp"/>
<text x="534" y="356" font-size="12" class="dg-m dg-b" data-w="376">AKS VNet 10.10.0.0/16</text>
<rect x="532" y="366" width="176" height="118" rx="10" class="dg-box dg-net"/>
<text x="542" y="386.5" font-size="12.5" class="dg-t dg-b" data-w="156">snet-pls (new)</text>
<text x="542" y="403" font-size="11" class="dg-m" data-w="156">Private Link Service</text>
<text x="542" y="419" font-size="11" class="dg-m" data-w="156">in front of the API</text>
<text x="542" y="435" font-size="11" class="dg-m" data-w="156">server load balancer</text>
<rect x="744" y="366" width="168" height="118" rx="10" class="dg-box dg-ok"/>
<text x="754" y="386.5" font-size="12.5" class="dg-t dg-b" data-w="148">API server</text>
<text x="754" y="403" font-size="11" class="dg-m" data-w="148">kube-apiserver ILB</text>
<text x="754" y="419" font-size="11" class="dg-m" data-w="148">snet-aks-apiserver</text>
<text x="754" y="435" font-size="11" class="dg-m" data-w="148">private IP · port 443</text>
<path d="M222 425 L258 425" class="dg-line dg-net" marker-end="url(#private-api-access-ah-net)"/>
<path d="M428 425 L532 425" class="dg-line dg-azure" marker-end="url(#private-api-access-ah-azure)"/>
<rect x="432.5" y="415" width="95" height="20" rx="6" class="dg-chip"/>
<text x="480" y="429" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">Private Link</text>
<path d="M708 425 L744 425" class="dg-line dg-ok" marker-end="url(#private-api-access-ah-ok)"/>
<rect x="24" y="524" width="588" height="92" rx="10" class="dg-box dg-id"/>
<text x="36" y="547" font-size="13" class="dg-t dg-b" data-w="564">DNS: the client must resolve the private FQDN</text>
<text x="36" y="564" font-size="11.5" class="dg-m" data-w="564">① Link the cluster's private DNS zone to the client VNet,</text>
<text x="36" y="580.5" font-size="11.5" class="dg-m" data-w="564">or forward the zone to Azure DNS Private Resolver</text>
<text x="36" y="597" font-size="11.5" class="dg-m" data-w="564">② Own zone + A record pointing to the Private Endpoint IP</text>
<rect x="632" y="524" width="304" height="92" rx="10" class="dg-box dg-warn"/>
<text x="644" y="547" font-size="13" class="dg-t dg-b" data-w="280">No network path yet?</text>
<text x="644" y="564" font-size="11.5" class="dg-m" data-w="280">az aks command invoke</text>
<text x="644" y="580.5" font-size="11.5" class="dg-m" data-w="280">Runs through the Azure API,</text>
<text x="644" y="597" font-size="11.5" class="dg-m" data-w="280">one-shot commands only (D-3)</text>
</svg>
