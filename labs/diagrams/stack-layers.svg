<text x="36" y="456" font-size="14" class="dg-t dg-b" data-w="888">Azure Blob 컨테이너 tfstate (02-bootstrap 이 생성)</text>
<text x="36" y="474" font-size="12" class="dg-m" data-w="888">모든 스택의 state 저장 · Entra ID 인증(계정 키 차단) · 버전 관리 · blob lease 로 잠금   ≈   S3 버킷 + DynamoDB 락 테이블</text>
