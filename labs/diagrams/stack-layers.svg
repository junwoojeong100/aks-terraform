<text x="24" y="32" font-size="18" class="dg-t dg-b">Terraform 스택 계층과 실행 순서</text>
<text x="24" y="54" font-size="12.5" class="dg-m">수명주기가 다른 것을 스택(= 독립된 state)으로 나눕니다. apply 는 화살표 방향, destroy 는 그 반대입니다.</text>
