.dg-on{fill:#fff}</style><defs><marker id="standard-vs-automatic-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="standard-vs-automatic-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="standard-vs-automatic-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker></defs><rect width="960" height="548" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">AKS Standard vs. AKS Automatic: who operates what</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Automatic is the equivalent of EKS Auto Mode. Blue cells are what you configure; green cells are what AKS handles by default.</text>
<rect x="196" y="96" width="368" height="36" rx="10" class="dg-box dg-azure"/>
<text x="380" y="118.5" font-size="13.5" text-anchor="middle" class="dg-t dg-b" data-w="352">AKS Standard (Lab 05) — design it yourself</text>
<rect x="576" y="96" width="360" height="36" rx="10" class="dg-box dg-ok"/>
<text x="756" y="118.5" font-size="13.5" text-anchor="middle" class="dg-t dg-b" data-w="344">AKS Automatic (Lab 10) ≈ EKS Auto Mode</text>
<rect x="24" y="140" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="163.5" font-size="12.5" class="dg-t dg-b" data-w="140">System node pool</text>
<rect x="196" y="140" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="163" font-size="12" class="dg-t dg-b" data-w="344">You create and operate it (System pool)</text>
<rect x="576" y="140" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="163" font-size="12" class="dg-t dg-b" data-w="336">Managed — operated by AKS</text>
<rect x="24" y="186" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="209.5" font-size="12.5" class="dg-t dg-b" data-w="140">Node scaling</text>
<rect x="196" y="186" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="209" font-size="12" class="dg-t dg-b" data-w="344">Cluster Autoscaler (or choose NAP)</text>
<rect x="576" y="186" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="209" font-size="12" class="dg-t dg-b" data-w="336">NAP (Karpenter) only + HPA · KEDA · VPA</text>
<rect x="24" y="232" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="255.5" font-size="12.5" class="dg-t dg-b" data-w="140">Upgrades</text>
<rect x="196" y="232" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="255" font-size="12" class="dg-t dg-b" data-w="344">Manual, or choose a channel (this lab: patch)</text>
<rect x="576" y="232" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="255" font-size="12" class="dg-t dg-b" data-w="336">stable channel (N-1) + automatic node images</text>
<rect x="24" y="278" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="301.5" font-size="12.5" class="dg-t dg-b" data-w="140">Auth · access</text>
<rect x="196" y="278" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="301" font-size="12" class="dg-t dg-b" data-w="344">Entra + Azure RBAC; you disable local accounts</text>
<rect x="576" y="278" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="301" font-size="12" class="dg-t dg-b" data-w="336">Azure RBAC only · no local accounts</text>
<rect x="24" y="324" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="347.5" font-size="12.5" class="dg-t dg-b" data-w="140">Networking</text>
<rect x="196" y="324" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="347" font-size="12" class="dg-t dg-b" data-w="344">Overlay + Cilium, you set up the NAT GW</text>
<rect x="576" y="324" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="347" font-size="12" class="dg-t dg-b" data-w="336">Overlay + Cilium, managed NAT, VNet integration</text>
<rect x="24" y="370" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="393.5" font-size="12.5" class="dg-t dg-b" data-w="140">Policy</text>
<rect x="196" y="370" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="393" font-size="12" class="dg-t dg-b" data-w="344">You assign Azure Policy yourself (Lab 08)</text>
<rect x="576" y="370" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="393" font-size="12" class="dg-t dg-b" data-w="336">Deployment Safeguards + PSS baseline enforced</text>
<rect x="24" y="416" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="439.5" font-size="12.5" class="dg-t dg-b" data-w="140">Observability</text>
<rect x="196" y="416" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="439" font-size="12" class="dg-t dg-b" data-w="344">You connect Prometheus · Container Insights</text>
<rect x="576" y="416" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="439" font-size="12" class="dg-t dg-b" data-w="336">Portal/CLI: on by default · Terraform: manual</text>
<rect x="24" y="462" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="485.5" font-size="12.5" class="dg-t dg-b" data-w="140">Tier · SLA</text>
<rect x="196" y="462" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="485" font-size="12" class="dg-t dg-b" data-w="344">Choose Free / Standard / Premium</text>
<rect x="576" y="462" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="485" font-size="12" class="dg-t dg-b" data-w="336">Fixed: Standard + Pod readiness SLA</text>
<text x="24" y="534" font-size="11.5" class="dg-m" data-w="912">※ Converting Standard to Automatic in place is not supported. Decide which one to use from the start.</text>
</svg>
