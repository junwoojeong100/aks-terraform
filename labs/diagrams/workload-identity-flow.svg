.dg-ah.dg-danger{fill:var(--dg-danger)}
.dg-on{fill:#fff}</style><defs><marker id="workload-identity-flow-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="workload-identity-flow-ah-aws" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-aws"/></marker><marker id="workload-identity-flow-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="workload-identity-flow-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker></defs><rect width="960" height="652" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">Workload Identity 흐름 (IRSA 와 비교)</text>
<text x="24" y="54" font-size="12.5" class="dg-m">두 방식 모두 &quot;ServiceAccount 토큰 → 클라우드 임시 자격 증명&quot; 교환이며 정적 키가 필요 없습니다.</text>
<rect x="24" y="88" width="912" height="236" rx="14" class="dg-grp dg-aws"/>
<text x="38" y="108" font-size="12.5" class="dg-tx-aws dg-b" data-w="884">AWS · EKS 의 IRSA</text>
<rect x="36" y="128" width="242" height="118" rx="10" class="dg-box"/>
<text x="48" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="218">Pod + ServiceAccount</text>
<text x="48" y="169" font-size="11" class="dg-m" data-w="218">SA annotation:</text>
<text x="48" y="185" font-size="11" class="dg-m" data-w="218">eks.amazonaws.com/role-arn</text>
<text x="48" y="201" font-size="11" class="dg-m" data-w="218">SA 토큰 aud:</text>
<text x="48" y="217" font-size="11" class="dg-m" data-w="218">sts.amazonaws.com</text>
<rect x="376" y="128" width="236" height="118" rx="10" class="dg-box dg-aws"/>
<text x="388" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="212">AWS STS</text>
<text x="388" y="169" font-size="11" class="dg-m" data-w="212">AssumeRoleWithWebIdentity</text>
<text x="388" y="185" font-size="11" class="dg-m" data-w="212">issuer 공개키로 서명 검증</text>
<text x="388" y="201" font-size="11" class="dg-m" data-w="212">신뢰 정책(sub) 확인</text>
<rect x="710" y="128" width="214" height="118" rx="10" class="dg-box dg-ok"/>
<text x="722" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="190">Secrets Manager</text>
<text x="722" y="169" font-size="11" class="dg-m" data-w="190">IAM 정책이 허용해야</text>
<text x="722" y="185" font-size="11" class="dg-m" data-w="190">GetSecretValue 성공</text>
<rect x="376" y="260" width="236" height="54" rx="10" class="dg-box dg-aws dg-dash"/>
<text x="386" y="280" font-size="12" class="dg-t dg-b" data-w="216">IAM Role 신뢰 정책 (OIDC)</text>
<text x="386" y="296" font-size="10.5" class="dg-m" data-w="216">sub = system:serviceaccount:ns:sa</text>
<path d="M278 171 L376 171" class="dg-line dg-aws" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="276.5" y="144" width="101" height="20" rx="6" class="dg-chip"/>
<text x="327" y="158" font-size="11.5" text-anchor="middle" class="dg-tx-aws dg-b">① SA 토큰 제시</text>
<path d="M376 205 L278 205" class="dg-line dg-aws" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="287" y="212" width="80" height="20" rx="6" class="dg-chip"/>
<text x="327" y="226" font-size="11.5" text-anchor="middle" class="dg-tx-aws dg-b">② 임시 자격</text>
<path d="M157 128 L157 116 L817 116 L817 128" class="dg-line dg-ok" marker-end="url(#workload-identity-flow-ah-ok)"/>
<rect x="363.5" y="106" width="247" height="20" rx="6" class="dg-chip"/>
<text x="487" y="120" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">③ 임시 자격으로 API 호출 (정적 키 없음)</text>
<path d="M494 260 L494 246" class="dg-line dg-aws dg-dash" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="24" y="338" width="912" height="236" rx="14" class="dg-grp dg-azure"/>
<text x="38" y="358" font-size="12.5" class="dg-tx-azure dg-b" data-w="884">Azure · AKS 의 Workload Identity</text>
<rect x="36" y="378" width="242" height="118" rx="10" class="dg-box"/>
<text x="48" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="218">Pod + ServiceAccount</text>
<text x="48" y="419" font-size="11" class="dg-m" data-w="218">label azure.workload.identity/use</text>
<text x="48" y="435" font-size="11" class="dg-m" data-w="218">annotation …/client-id = UAMI</text>
<text x="48" y="451" font-size="11" class="dg-m" data-w="218">SA 토큰 aud:</text>
<text x="48" y="467" font-size="11" class="dg-m" data-w="218">api://AzureADTokenExchange</text>
<rect x="376" y="378" width="236" height="118" rx="10" class="dg-box dg-azure"/>
<text x="388" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="212">Microsoft Entra ID</text>
<text x="388" y="419" font-size="11" class="dg-m" data-w="212">토큰 엔드포인트</text>
<text x="388" y="435" font-size="11" class="dg-m" data-w="212">issuer 공개키로 서명 검증</text>
<text x="388" y="451" font-size="11" class="dg-m" data-w="212">federated credential 확인</text>
<rect x="710" y="378" width="214" height="118" rx="10" class="dg-box dg-ok"/>
<text x="722" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="190">Key Vault</text>
<text x="722" y="419" font-size="11" class="dg-m" data-w="190">Azure RBAC 역할</text>
<text x="722" y="435" font-size="11" class="dg-m" data-w="190">&quot;Key Vault Secrets User&quot;</text>
<rect x="376" y="510" width="236" height="54" rx="10" class="dg-box dg-azure dg-dash"/>
<text x="386" y="530" font-size="12" class="dg-t dg-b" data-w="216">UAMI + Federated credential</text>
<text x="386" y="546" font-size="10.5" class="dg-m" data-w="216">issuer = OIDC URL · subject = SA</text>
<path d="M278 421 L376 421" class="dg-line dg-azure" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="276.5" y="394" width="101" height="20" rx="6" class="dg-chip"/>
<text x="327" y="408" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">① SA 토큰 제시</text>
<path d="M376 455 L278 455" class="dg-line dg-azure" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="281" y="462" width="92" height="20" rx="6" class="dg-chip"/>
<text x="327" y="476" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">② 액세스 토큰</text>
<path d="M157 378 L157 366 L817 366 L817 378" class="dg-line dg-ok" marker-end="url(#workload-identity-flow-ah-ok)"/>
<rect x="357.5" y="356" width="259" height="20" rx="6" class="dg-chip"/>
<text x="487" y="370" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">③ 액세스 토큰으로 API 호출 (정적 키 없음)</text>
<path d="M494 510 L494 496" class="dg-line dg-azure dg-dash" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="24" y="584" width="912" height="56" rx="10" class="dg-box"/>
<text x="36" y="608" font-size="12" class="dg-t" data-w="888">Azure: webhook 이 환경 변수(AZURE_CLIENT_ID 등)와 SA 토큰 볼륨을 파드에 주입하고,</text>
<text x="36" y="625" font-size="12" class="dg-t" data-w="888">앱은 SDK 의 DefaultAzureCredential 로 자동 인증합니다 (Lab 06).</text>
</svg>
