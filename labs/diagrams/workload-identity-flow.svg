.dg-on{fill:#fff}</style><defs><marker id="workload-identity-flow-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="workload-identity-flow-ah-aws" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-aws"/></marker><marker id="workload-identity-flow-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker><marker id="workload-identity-flow-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker></defs><rect width="960" height="652" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">Workload Identity flow (compared with IRSA)</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Both approaches exchange a ServiceAccount token for temporary cloud credentials, so no static keys are needed.</text>
<rect x="24" y="88" width="912" height="236" rx="14" class="dg-grp dg-aws"/>
<text x="38" y="108" font-size="12.5" class="dg-tx-aws dg-b" data-w="884">AWS · IRSA on EKS</text>
<rect x="36" y="128" width="236" height="118" rx="10" class="dg-box"/>
<text x="48" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="212">Pod + ServiceAccount</text>
<text x="48" y="169" font-size="11" class="dg-m" data-w="212">SA annotation:</text>
<text x="48" y="185" font-size="11" class="dg-m" data-w="212">eks.amazonaws.com/role-arn</text>
<text x="48" y="201" font-size="11" class="dg-m" data-w="212">SA token aud:</text>
<text x="48" y="217" font-size="11" class="dg-m" data-w="212">sts.amazonaws.com</text>
<rect x="428" y="128" width="226" height="118" rx="10" class="dg-box dg-aws"/>
<text x="440" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="202">AWS STS</text>
<text x="440" y="169" font-size="11" class="dg-m" data-w="202">AssumeRoleWithWebIdentity</text>
<text x="440" y="185" font-size="11" class="dg-m" data-w="202">Verifies the signature with</text>
<text x="440" y="201" font-size="11" class="dg-m" data-w="202">the issuer's public key</text>
<text x="440" y="217" font-size="11" class="dg-m" data-w="202">Checks the trust policy (sub)</text>
<rect x="722" y="128" width="202" height="118" rx="10" class="dg-box dg-ok"/>
<text x="734" y="151.5" font-size="13.5" class="dg-t dg-b" data-w="178">Secrets Manager</text>
<text x="734" y="169" font-size="11" class="dg-m" data-w="178">If the IAM policy allows it,</text>
<text x="734" y="185" font-size="11" class="dg-m" data-w="178">GetSecretValue succeeds</text>
<rect x="428" y="260" width="226" height="54" rx="10" class="dg-box dg-aws dg-dash"/>
<text x="438" y="280" font-size="12" class="dg-t dg-b" data-w="206">IAM role trust policy (OIDC)</text>
<text x="438" y="296" font-size="10.5" class="dg-m" data-w="206">sub = system:serviceaccount:ns:sa</text>
<path d="M272 171 L428 171" class="dg-line dg-aws" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="281" y="144" width="138" height="20" rx="6" class="dg-chip"/>
<text x="350" y="158" font-size="11.5" text-anchor="middle" class="dg-tx-aws dg-b">① Present SA token</text>
<path d="M428 205 L272 205" class="dg-line dg-aws" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="297" y="212" width="106" height="20" rx="6" class="dg-chip"/>
<text x="350" y="226" font-size="11.5" text-anchor="middle" class="dg-tx-aws dg-b">② Credentials</text>
<path d="M154 128 L154 116 L823 116 L823 128" class="dg-line dg-ok" marker-end="url(#workload-identity-flow-ah-ok)"/>
<rect x="289" y="106" width="399" height="20" rx="6" class="dg-chip"/>
<text x="488.5" y="120" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">③ Call the API with temporary credentials (no static keys)</text>
<path d="M541 260 L541 246" class="dg-line dg-aws dg-dash" marker-end="url(#workload-identity-flow-ah-aws)"/>
<rect x="24" y="338" width="912" height="236" rx="14" class="dg-grp dg-azure"/>
<text x="38" y="358" font-size="12.5" class="dg-tx-azure dg-b" data-w="884">Azure · Workload Identity on AKS</text>
<rect x="36" y="378" width="236" height="118" rx="10" class="dg-box"/>
<text x="48" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="212">Pod + ServiceAccount</text>
<text x="48" y="419" font-size="11" class="dg-m" data-w="212">label azure.workload.identity/use</text>
<text x="48" y="435" font-size="11" class="dg-m" data-w="212">annotation …/client-id = UAMI</text>
<text x="48" y="451" font-size="11" class="dg-m" data-w="212">SA token aud:</text>
<text x="48" y="467" font-size="11" class="dg-m" data-w="212">api://AzureADTokenExchange</text>
<rect x="428" y="378" width="226" height="118" rx="10" class="dg-box dg-azure"/>
<text x="440" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="202">Microsoft Entra ID</text>
<text x="440" y="419" font-size="11" class="dg-m" data-w="202">Token endpoint</text>
<text x="440" y="435" font-size="11" class="dg-m" data-w="202">Verifies the signature with</text>
<text x="440" y="451" font-size="11" class="dg-m" data-w="202">the issuer's public key</text>
<text x="440" y="467" font-size="11" class="dg-m" data-w="202">Checks the federated credential</text>
<rect x="722" y="378" width="202" height="118" rx="10" class="dg-box dg-ok"/>
<text x="734" y="401.5" font-size="13.5" class="dg-t dg-b" data-w="178">Key Vault</text>
<text x="734" y="419" font-size="11" class="dg-m" data-w="178">Azure RBAC role</text>
<text x="734" y="435" font-size="11" class="dg-m" data-w="178">&quot;Key Vault Secrets User&quot;</text>
<rect x="428" y="510" width="226" height="54" rx="10" class="dg-box dg-azure dg-dash"/>
<text x="438" y="530" font-size="12" class="dg-t dg-b" data-w="206">UAMI + Federated credential</text>
<text x="438" y="546" font-size="10.5" class="dg-m" data-w="206">issuer = OIDC URL · subject = SA</text>
<path d="M272 421 L428 421" class="dg-line dg-azure" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="281" y="394" width="138" height="20" rx="6" class="dg-chip"/>
<text x="350" y="408" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">① Present SA token</text>
<path d="M428 455 L272 455" class="dg-line dg-azure" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="295" y="462" width="110" height="20" rx="6" class="dg-chip"/>
<text x="350" y="476" font-size="11.5" text-anchor="middle" class="dg-tx-azure dg-b">② Access token</text>
<path d="M154 378 L154 366 L823 366 L823 378" class="dg-line dg-ok" marker-end="url(#workload-identity-flow-ah-ok)"/>
<rect x="308" y="356" width="361" height="20" rx="6" class="dg-chip"/>
<text x="488.5" y="370" font-size="11.5" text-anchor="middle" class="dg-tx-ok dg-b">③ Call the API with the access token (no static keys)</text>
<path d="M541 510 L541 496" class="dg-line dg-azure dg-dash" marker-end="url(#workload-identity-flow-ah-azure)"/>
<rect x="24" y="584" width="912" height="56" rx="10" class="dg-box"/>
<text x="36" y="608" font-size="12" class="dg-t" data-w="888">Azure: a webhook injects environment variables (AZURE_CLIENT_ID, etc.) and the SA token volume into the pod,</text>
<text x="36" y="625" font-size="12" class="dg-t" data-w="888">and the app authenticates automatically using DefaultAzureCredential from the SDK (Lab 06).</text>
</svg>
