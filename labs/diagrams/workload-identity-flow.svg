<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 652" width="960" height="652" role="img" aria-labelledby="workload-identity-flow-t workload-identity-flow-d"><title id="workload-identity-flow-t">Workload Identity 흐름 (IRSA 와 비교)</title><desc id="workload-identity-flow-d">파드가 ServiceAccount 토큰을 클라우드의 토큰 교환 서비스(AWS STS 또는 Microsoft Entra ID)에 제시하고, 신뢰 설정을 검증받아 임시 자격 증명이나 액세스 토큰을 받은 뒤 대상 서비스(Secrets Manager 또는 Key Vault)를 호출하는 3단계 흐름을 AWS 와 Azure 로 나란히 보여 준다.</desc><style>svg.dg{--dg-bg:#ffffff;--dg-fg:#1f2328;--dg-muted:#59636e;--dg-line:#6e7781;--dg-card:#f6f8fa;--dg-border:#d1d9e0;--dg-aws:#c2590a;--dg-aws-soft:#fff1e5;--dg-azure:#0b6ed0;--dg-azure-soft:#e5f1ff;--dg-ok:#1a7f37;--dg-ok-soft:#e6f6ea;--dg-id:#8250df;--dg-id-soft:#f3ecff;--dg-net:#0e7490;--dg-net-soft:#e0f4f8;--dg-warn:#9a6700;--dg-warn-soft:#fff6d6;--dg-danger:#cf222e;--dg-danger-soft:#ffebe9;font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif}
@media (prefers-color-scheme:dark){svg.dg{--dg-bg:#0d1117;--dg-fg:#e6edf3;--dg-muted:#9198a1;--dg-line:#8b949e;--dg-card:#151b23;--dg-border:#30363d;--dg-aws:#f0883e;--dg-aws-soft:#2b1c10;--dg-azure:#58a6ff;--dg-azure-soft:#0f2238;--dg-ok:#3fb950;--dg-ok-soft:#0f2417;--dg-id:#b392f0;--dg-id-soft:#221a36;--dg-net:#39c5cf;--dg-net-soft:#0d2a2f;--dg-warn:#d29922;--dg-warn-soft:#2d2208;--dg-danger:#ff7b72;--dg-danger-soft:#3a1517}}
