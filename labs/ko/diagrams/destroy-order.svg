<text x="36" y="419" font-size="13" class="dg-t dg-b" data-w="888">실행</text>
<text x="36" y="436" font-size="12" class="dg-t" data-w="888">scripts/cleanup.sh --dry-run  →  scripts/cleanup.sh   (확인 입력 · 이미 지운 스택은 건너뜀 · 마지막에 남은 리소스 점검)</text>
