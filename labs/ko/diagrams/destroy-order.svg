<text x="24" y="32" font-size="18" class="dg-t dg-b">삭제(destroy) 순서와 주의점</text>
<text x="24" y="54" font-size="12.5" class="dg-m">생성의 역순입니다. scripts/cleanup.sh 가 이 순서와 안전장치를 자동으로 처리합니다.</text>
<rect x="24" y="100" width="204" height="118" rx="10" class="dg-box dg-dash"/>
<text x="36" y="124" font-size="14" class="dg-t dg-b" data-w="180">10-aks-automatic</text>
<text x="36" y="142" font-size="12.5" class="dg-m" data-w="180">AKS Automatic (선택)</text>
<text x="36" y="159.5" font-size="12.5" class="dg-m" data-w="180">05 와 독립이라 가장 먼저</text>
<circle cx="206" cy="122" r="11" class="dg-fill-danger"/>
<text x="206" y="126.2" font-size="12" text-anchor="middle" class="dg-b dg-on">1</text>
<rect x="260" y="100" width="204" height="118" rx="10" class="dg-box dg-warn"/>
<text x="272" y="124" font-size="14" class="dg-t dg-b" data-w="180">08-governance</text>
<text x="272" y="142" font-size="12.5" class="dg-m" data-w="180">리소스 잠금을 먼저 해제</text>
<text x="272" y="159.5" font-size="12.5" class="dg-m" data-w="180">(잠금이 있으면 ScopeLocked)</text>
<text x="272" y="177" font-size="12.5" class="dg-m" data-w="180">Defender 플랜도 함께 해제</text>
<circle cx="442" cy="122" r="11" class="dg-fill-danger"/>
<text x="442" y="126.2" font-size="12" text-anchor="middle" class="dg-b dg-on">2</text>
<rect x="496" y="100" width="204" height="118" rx="10" class="dg-box dg-id"/>
<text x="508" y="124" font-size="14" class="dg-t dg-b" data-w="180">07-ingress</text>
<text x="508" y="142" font-size="12.5" class="dg-m" data-w="180">클러스터가 살아 있어야</text>
<text x="508" y="159.5" font-size="12.5" class="dg-m" data-w="180">kubernetes provider 가</text>
<text x="508" y="177" font-size="12.5" class="dg-m" data-w="180">접속해 삭제할 수 있음</text>
<circle cx="678" cy="122" r="11" class="dg-fill-danger"/>
<text x="678" y="126.2" font-size="12" text-anchor="middle" class="dg-b dg-on">3</text>
<rect x="732" y="100" width="204" height="118" rx="10" class="dg-box dg-id"/>
<text x="744" y="124" font-size="14" class="dg-t dg-b" data-w="180">06-workload</text>
<text x="744" y="142" font-size="12.5" class="dg-m" data-w="180">07 과 같은 이유</text>
<text x="744" y="159.5" font-size="12.5" class="dg-m" data-w="180">UAMI · 연합 자격 증명</text>
<text x="744" y="177" font-size="12.5" class="dg-m" data-w="180">Key Vault 데모 시크릿</text>
<circle cx="914" cy="122" r="11" class="dg-fill-danger"/>
<text x="914" y="126.2" font-size="12" text-anchor="middle" class="dg-b dg-on">4</text>
<rect x="732" y="258" width="204" height="118" rx="10" class="dg-box dg-azure"/>
<text x="744" y="282" font-size="14" class="dg-t dg-b" data-w="180">05-aks</text>
<text x="744" y="300" font-size="12.5" class="dg-m" data-w="180">AKS + 노드 풀</text>
<text x="744" y="317.5" font-size="12.5" class="dg-m" data-w="180">노드 리소스 그룹도 함께</text>
<text x="744" y="335" font-size="12.5" class="dg-m" data-w="180">삭제 (10–20분)</text>
<circle cx="914" cy="280" r="11" class="dg-fill-danger"/>
<text x="914" y="284.2" font-size="12" text-anchor="middle" class="dg-b dg-on">5</text>
<rect x="496" y="258" width="204" height="118" rx="10" class="dg-box dg-ok"/>
<text x="508" y="282" font-size="14" class="dg-t dg-b" data-w="180">04-platform</text>
<text x="508" y="300" font-size="12.5" class="dg-m" data-w="180">ACR · Key Vault · Grafana</text>
<text x="508" y="317.5" font-size="12.5" class="dg-m" data-w="180">Key Vault 는 soft-delete:</text>
<text x="508" y="335" font-size="12.5" class="dg-m" data-w="180">7일간 이름만 점유 (무과금)</text>
<circle cx="678" cy="280" r="11" class="dg-fill-danger"/>
<text x="678" y="284.2" font-size="12" text-anchor="middle" class="dg-b dg-on">6</text>
<rect x="260" y="258" width="204" height="118" rx="10" class="dg-box dg-net"/>
<text x="272" y="282" font-size="14" class="dg-t dg-b" data-w="180">03-network</text>
<text x="272" y="300" font-size="12.5" class="dg-m" data-w="180">NAT Gateway · 공인 IP</text>
<text x="272" y="317.5" font-size="12.5" class="dg-m" data-w="180">삭제되면 과금 중지</text>
<text x="272" y="335" font-size="12.5" class="dg-m" data-w="180">Private DNS Zone</text>
<circle cx="442" cy="280" r="11" class="dg-fill-danger"/>
<text x="442" y="284.2" font-size="12" text-anchor="middle" class="dg-b dg-on">7</text>
<rect x="24" y="258" width="204" height="118" rx="10" class="dg-box dg-dash"/>
<text x="36" y="282" font-size="14" class="dg-t dg-b" data-w="180">02-bootstrap (옵션)</text>
<text x="36" y="300" font-size="12.5" class="dg-m" data-w="180">state 저장소 자신이라</text>
<text x="36" y="317.5" font-size="12.5" class="dg-m" data-w="180">로컬 state 로 되돌린 뒤</text>
<text x="36" y="335" font-size="12.5" class="dg-m" data-w="180">마지막에 삭제</text>
<circle cx="206" cy="280" r="11" class="dg-fill-danger"/>
<text x="206" y="284.2" font-size="12" text-anchor="middle" class="dg-b dg-on">8</text>
