<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 632" width="960" height="632" role="img" aria-labelledby="private-api-access-t private-api-access-d"><title id="private-api-access-t">프라이빗 API 서버에 접속하는 2가지 방법</title><desc id="private-api-access-d">방법 1 은 클라이언트(점프 호스트, 피어링된 VNet 의 러너, VPN 이나 ExpressRoute 로 연결한 노트북)를 snet-aks-apiserver 에 있는 API 서버 로드밸런서의 사설 IP 로 연결한다. 방법 2 는 클라이언트 VNet 에 Private Endpoint 를 만들어 같은 로드밸런서 앞의 Private Link Service 에 연결한다. 두 방법 모두 프라이빗 FQDN 을 해석할 DNS 가 필요하다.</desc><style>svg.dg{--dg-bg:#ffffff;--dg-fg:#1f2328;--dg-muted:#59636e;--dg-line:#6e7781;--dg-card:#f6f8fa;--dg-border:#d1d9e0;--dg-aws:#c2590a;--dg-aws-soft:#fff1e5;--dg-azure:#0b6ed0;--dg-azure-soft:#e5f1ff;--dg-ok:#1a7f37;--dg-ok-soft:#e6f6ea;--dg-id:#8250df;--dg-id-soft:#f3ecff;--dg-net:#0e7490;--dg-net-soft:#e0f4f8;--dg-warn:#9a6700;--dg-warn-soft:#fff6d6;--dg-danger:#cf222e;--dg-danger-soft:#ffebe9;font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif}
@media (prefers-color-scheme:dark){svg.dg{--dg-bg:#0d1117;--dg-fg:#e6edf3;--dg-muted:#9198a1;--dg-line:#8b949e;--dg-card:#151b23;--dg-border:#30363d;--dg-aws:#f0883e;--dg-aws-soft:#2b1c10;--dg-azure:#58a6ff;--dg-azure-soft:#0f2238;--dg-ok:#3fb950;--dg-ok-soft:#0f2417;--dg-id:#b392f0;--dg-id-soft:#221a36;--dg-net:#39c5cf;--dg-net-soft:#0d2a2f;--dg-warn:#d29922;--dg-warn-soft:#2d2208;--dg-danger:#ff7b72;--dg-danger-soft:#3a1517}}
