.dg-on{fill:#fff}</style><defs><marker id="standard-vs-automatic-ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah"/></marker><marker id="standard-vs-automatic-ah-azure" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-azure"/></marker><marker id="standard-vs-automatic-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-ah dg-ok"/></marker></defs><rect width="960" height="548" class="dg-bg" rx="12"/>
<text x="24" y="32" font-size="18" class="dg-t dg-b">AKS Standard 와 AKS Automatic: 누가 운영하나</text>
<text x="24" y="54" font-size="12.5" class="dg-m">Automatic 은 EKS Auto Mode 에 해당합니다. 파란 칸은 내가 구성하는 것, 초록 칸은 AKS 가 기본으로 맡는 것입니다.</text>
<rect x="196" y="96" width="368" height="36" rx="10" class="dg-box dg-azure"/>
<text x="380" y="118.5" font-size="13.5" text-anchor="middle" class="dg-t dg-b" data-w="352">AKS Standard (Lab 05) — 직접 설계</text>
<rect x="576" y="96" width="360" height="36" rx="10" class="dg-box dg-ok"/>
<text x="756" y="118.5" font-size="13.5" text-anchor="middle" class="dg-t dg-b" data-w="344">AKS Automatic (Lab 10) ≈ EKS Auto Mode</text>
<rect x="24" y="140" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="163.5" font-size="12.5" class="dg-t dg-b" data-w="140">시스템 노드 풀</text>
<rect x="196" y="140" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="163" font-size="12" class="dg-t dg-b" data-w="344">직접 만들고 운영 (System 풀)</text>
<rect x="576" y="140" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="163" font-size="12" class="dg-t dg-b" data-w="336">관리형 — AKS 가 운영</text>
<rect x="24" y="186" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="209.5" font-size="12.5" class="dg-t dg-b" data-w="140">노드 스케일링</text>
<rect x="196" y="186" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="209" font-size="12" class="dg-t dg-b" data-w="344">Cluster Autoscaler (또는 NAP 선택)</text>
<rect x="576" y="186" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="209" font-size="12" class="dg-t dg-b" data-w="336">NAP(Karpenter) 고정 + HPA · KEDA · VPA</text>
<rect x="24" y="232" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="255.5" font-size="12.5" class="dg-t dg-b" data-w="140">업그레이드</text>
<rect x="196" y="232" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="255" font-size="12" class="dg-t dg-b" data-w="344">수동 또는 채널 선택 (이 실습은 patch)</text>
<rect x="576" y="232" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="255" font-size="12" class="dg-t dg-b" data-w="336">stable 채널(N-1) + 노드 이미지 자동</text>
<rect x="24" y="278" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="301.5" font-size="12.5" class="dg-t dg-b" data-w="140">인증 · 접근</text>
<rect x="196" y="278" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="301" font-size="12" class="dg-t dg-b" data-w="344">Entra + Azure RBAC, 로컬 계정은 직접 끔</text>
<rect x="576" y="278" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="301" font-size="12" class="dg-t dg-b" data-w="336">Azure RBAC 고정 · 로컬 계정 없음</text>
<rect x="24" y="324" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="347.5" font-size="12.5" class="dg-t dg-b" data-w="140">네트워크</text>
<rect x="196" y="324" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="347" font-size="12" class="dg-t dg-b" data-w="344">Overlay + Cilium · NAT GW 를 직접 구성</text>
<rect x="576" y="324" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="347" font-size="12" class="dg-t dg-b" data-w="336">Overlay + Cilium · 관리형 NAT · VNet 통합</text>
<rect x="24" y="370" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="393.5" font-size="12.5" class="dg-t dg-b" data-w="140">정책 · 안전장치</text>
<rect x="196" y="370" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="393" font-size="12" class="dg-t dg-b" data-w="344">Azure Policy 를 직접 할당 (Lab 08)</text>
<rect x="576" y="370" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="393" font-size="12" class="dg-t dg-b" data-w="336">Deployment Safeguards + PSS baseline 강제</text>
<rect x="24" y="416" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="439.5" font-size="12.5" class="dg-t dg-b" data-w="140">관측성</text>
<rect x="196" y="416" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="439" font-size="12" class="dg-t dg-b" data-w="344">Prometheus · Container Insights 직접 연결</text>
<rect x="576" y="416" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="439" font-size="12" class="dg-t dg-b" data-w="336">포털/CLI 는 기본 · Terraform 은 직접 연결</text>
<rect x="24" y="462" width="160" height="38" rx="10" class="dg-box"/>
<text x="34" y="485.5" font-size="12.5" class="dg-t dg-b" data-w="140">등급 · SLA</text>
<rect x="196" y="462" width="368" height="38" rx="10" class="dg-box dg-azure"/>
<text x="208" y="485" font-size="12" class="dg-t dg-b" data-w="344">Free / Standard / Premium 중 선택</text>
<rect x="576" y="462" width="360" height="38" rx="10" class="dg-box dg-ok"/>
<text x="588" y="485" font-size="12" class="dg-t dg-b" data-w="336">Standard + Pod readiness SLA 고정</text>
<text x="24" y="534" font-size="11.5" class="dg-m" data-w="912">※ Standard 에서 Automatic 으로 제자리 전환은 지원되지 않습니다. 처음부터 어느 쪽을 쓸지 정하세요.</text>
</svg>
